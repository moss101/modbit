# PX-167: dependency advisory, license and source gates. Run by the
# `supply-chain` CI job: `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore names its reason; the CI job prints this list.
ignore = [
  # quick-xml 0.38 is reached only through object_store (S3 response bodies
  # from the operator's configured store). Both advisories are denial of
  # service on hostile XML; a fix needs an object_store release that moves
  # to a patched quick-xml. Revisit when object_store updates.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via object_store; XML comes from the operator-configured object store, DoS only; no compatible patched release" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via object_store; same path and reason as RUSTSEC-2026-0194" },
  # zstd 0.13 is reached only through tantivy's sstable reader over index
  # files the Core wrote itself. The streaming-context reuse and Seekable /
  # legacy-frame paths are not called; a fix needs a tantivy release.
  { id = "RUSTSEC-2026-0391", reason = "zstd via tantivy-sstable over locally written index files; the reused-context path is not used; no compatible patched release" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe via tantivy; Seekable decompress is not called" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe via tantivy; legacy-frame streaming decompression is not called on index data" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL",
  "CDLA-Permissive-2.0", "BSL-1.0", "0BSD", "MIT-0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses.private]
# The workspace's own crates are unpublished and carry no license field.
ignore = true
