[package]
name = "modbit-event-store"
description = "Modbit event-store: append-only canonical event store and projections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
modbit-domain.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
[package.metadata.modbit]
owner = "domain-events"
canonical = ["event-state"]
capabilities = [{ id = "events.append", requirements = ["REQ-EV-0010", "REQ-EV-0101"] }]
