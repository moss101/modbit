[package]
name = "modbit-context"
description = "Modbit context: Context Pack planner, packer and provenance ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modbit-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
# owner: subsystem node id in graph/project-graph.json; canonical: doc 81 single-owner
# systems this crate is THE implementation of (at most one member per system);
# capabilities: production capabilities with their requirement ids.
[package.metadata.modbit]
owner = "context-engine"
canonical = ["context-retrieval-engine"]
capabilities = [
  { id = "context.pack_compiler", requirements = ["REQ-EV-0166", "REQ-EV-0169"] },
  { id = "context.provenance_ledger", requirements = ["REQ-EV-0169", "REQ-EV-0168"] },
]
