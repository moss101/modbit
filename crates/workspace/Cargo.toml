[package]
name = "modbit-workspace"
description = "Modbit workspace: canonical file service and revisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modbit-domain.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
# owner: subsystem node id in graph/project-graph.json; canonical: doc 81 single-owner
# systems this crate is THE implementation of (at most one member per system);
# capabilities: production capabilities with their requirement ids (none yet).
[package.metadata.modbit]
owner = "workspace-git"
canonical = ["workspace-change-engine"]
capabilities = []
