[package]
name = "modbit-workspace"
description = "Modbit workspace: canonical file service and revisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
globset.workspace = true
hex.workspace = true
modbit-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
[package.metadata.modbit]
owner = "workspace-git"
canonical = ["workspace-change-engine"]
capabilities = [
  { id = "fs.read", requirements = ["REQ-EV-0014"] },
  { id = "fs.write", requirements = ["REQ-EV-0014", "REQ-EV-0106"] },
]
