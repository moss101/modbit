[package]
name = "modbit-browser"
description = "Modbit browser: semantic browser protocol and control leases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modbit-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
# owner: subsystem node id in graph/project-graph.json; canonical: doc 81 single-owner
# systems this crate is THE implementation of (at most one member per system);
# capabilities: production capabilities with their requirement ids (none yet).
[package.metadata.modbit]
owner = "browser"
canonical = ["browser-runtime"]
capabilities = [
  { id = "browser.session", requirements = ["REQ-EV-0276"] },
  { id = "browser.host_boundary", requirements = ["REQ-EV-0110"] },
  { id = "browser.injection_detection", requirements = ["REQ-EV-0284"] },
]
