// The slash menu's inventory as a typed union (REQ-PX-052; docs/62 PX-052,
// docs/65 AFW-D08): skills, extension-provided commands and subagent profiles
// in one ordered list. It is a view over the registries that already exist —
// the skill registry (`crates/skills`), the session's loaded extensions and
// the agent-profile directories — and adds no registry of its own. It carries
// metadata only: no skill body, no command template, no profile context and
// no secret.
//
// Served inside `SkillList.slash` (skills_budgets.proto, field block
// 260-279), so one `ListSkills` read answers the menu.
//
// Not carried, because the Core has no source for it today: actions, model
// switches, usage counters for ranking, a where-it-applies flag and a
// sync-eligibility flag.
syntax = "proto3";

package modbit.v1;

// One entry of the slash menu.
message SlashEntry {
  // SKILL | COMMAND | SUBAGENT
  string kind = 1;
  // What names it: a skill's name, `<extension>/<command>`, a profile's name.
  string id = 2;
  // What the menu shows after the slash.
  string display_name = 3;
  string description = 4;
  // SYSTEM | PROJECT | EXTENSION | USER. A command is always EXTENSION. A
  // profile is PROJECT (`.modbit/agents`), EXTENSION (an active extension's
  // `agents/`) or USER (the operator's profile directory).
  string scope = 5;
  // A skill's trust state; a command's extension signature label or
  // QUARANTINED; a profile's is `PROFILE` (profiles only ever narrow).
  string trust = 6;
  string trust_detail = 7;
  // The entry can be used now. A revoked or untrusted skill and a command of
  // a quarantined extension are listed with their state and `enabled = false`.
  bool enabled = 8;
  // BOTH | USER_ONLY | MODEL_ONLY. A skill's comes from its metadata; a
  // command is run by a person; a profile is chosen by the model's spawn.
  string invocation = 9;
  // Shipped with the system rather than imported: System-scope skills.
  bool built_in = 10;
  // A skill's package hash; an extension command's manifest digest; a
  // profile file's sha256.
  string content_hash = 11;
  string provenance_source = 12;
  // Where it was loaded from.
  string source = 13;
}
