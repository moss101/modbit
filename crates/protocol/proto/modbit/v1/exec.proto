// modbit-execd wire protocol (docs/21 "Structured command contract", "Durable
// modbit-execd"). Same framing and boot-secret handshake as the local
// SurfaceProtocol; the broker only executes what an authenticated Core sends,
// it never decides policy or mints capabilities.
syntax = "proto3";

package modbit.v1;

import "modbit/v1/domain.proto";
import "modbit/v1/negotiation.proto";
import "modbit/v1/security_runtime.proto";
import "modbit/v1/surface.proto";

message ExecRequest {
  string request_id = 1;              // client-stable; retries replay
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;        // explicit environment (no inheritance unless listed)
  bool inherit_env = 5;               // when true, start from the broker's environment then apply `env`
  uint64 timeout_ms = 6;              // 0 = none
  bool pty = 7;
  string stdin_mode = 8;              // "closed" | "open"
  uint64 output_budget_bytes = 9;     // inline bytes delivered to the model view before the rest is by ref
  string execution_profile = 10;
  Id capability_lease_id = 11;
  optional string terminal_session_id = 12;  // reuse a durable shell session (M2 later)
  // FIX-20: the principal that owns the session (`task:<id>`); empty = the
  // host itself. Only the owner and the host may list, read, write to or
  // cancel it; any other requester is refused SESSION_NOT_OWNED.
  string owner = 13;
  // PX-099 (field block 120-139): the PTY's initial size; 0 = 40 rows, 120
  // columns. A later `Resize` changes it.
  uint32 pty_rows = 120;
  uint32 pty_cols = 121;
}

message ExecStarted {
  string request_id = 1;
  string session_id = 2;              // durable handle for attach/cancel/replay
  uint32 process_id = 3;
  bool replayed = 4;
}

// One slice of output in cursor order. `cursor` is the byte offset of the
// first byte of `data` in the session's full output log; `stream` is
// "stdout", "stderr" or "pty".
message OutputChunk {
  string session_id = 1;
  uint64 cursor = 2;
  string stream = 3;
  bytes data = 4;
}

message ProcessExited {
  string session_id = 1;
  optional int32 exit_code = 2;
  optional int32 signal = 3;
  uint64 duration_ms = 4;
  // Content-addressed full output (sha256 hex) and its size; the model view is bounded, this is complete.
  string output_ref = 5;
  uint64 total_bytes = 6;
  bool timed_out = 7;
  bool cancelled = 8;
  // FIX-09/FIX-20: the cursor of the first byte `output_ref` holds. 0 = the
  // object is the complete output; larger = the replay window had already
  // dropped the head, and `output_ref` is the sha256 of the retained tail
  // (`total_bytes - retained_from` bytes), sealed in the Core's object store.
  uint64 retained_from = 9;
}

message Attach {
  string session_id = 1;
  uint64 after_cursor = 2;            // replay output with cursor >= after_cursor, then live
  // Terminal replay generation (docs/13 "Fencing and epochs", M4.5): a Core
  // presents its boot generation; an attach with an older generation than
  // the session's current one is refused STALE_GENERATION, and a newer one
  // ends every older attachment. 0 = unfenced (a local reader of the log).
  uint64 generation = 3;
  // FIX-20: who is attaching (`task:<id>`); empty = the host. A task may
  // attach only to a session it owns. A cursor older than the replay window
  // is answered CURSOR_EXPIRED (message carries `oldest_cursor=<n>`).
  string requester = 4;
  // PX-099 (field block 120-139). The most output bytes the broker may have
  // sent on this attachment beyond the last `Ack`: at the window it pauses
  // (the log on disk holds the rest, nothing is buffered) and, with no `Ack`
  // for `stall_ms`, ends the attachment ATTACH_STALLED naming the cursor to
  // resume from. 0 = an unwindowed attachment (the Core's own reads).
  uint64 window_bytes = 120;
  // How long a full window waits for an `Ack` before the attachment is
  // dropped to cursor-pull; 0 = the broker's default (30 s).
  uint64 stall_ms = 121;
  // When true a cursor beyond the session's head is refused
  // CURSOR_BEYOND_HEAD instead of waiting for output to reach it.
  bool strict_cursor = 122;
}

message WriteStdin {
  string session_id = 1;
  bytes data = 2;
  string requester = 3;               // FIX-20, as Attach.requester
  // PX-099 (field block 120-139). True: the broker answers `StdinWritten`
  // (with the cursor the log had reached) when the bytes were written.
  bool want_ack = 120;
  // True: these are a person's keystrokes, accepted only from the
  // connection that holds the session's input lease (LEASE_REQUIRED
  // otherwise). False: the agent's, refused INPUT_LEASED while any person
  // holds the lease.
  bool as_user = 121;
}

// PX-099: the client acknowledges the last output cursor it consumed on its
// attachment to `session_id` (the cursor after the last byte it has).
message TerminalAck {
  string session_id = 1;
  uint64 cursor = 2;
}

// PX-099: change the PTY's size; refused NOT_A_PTY for a piped session and
// BAD_SIZE outside 1..=500 rows, 1..=1000 columns.
message TerminalResize {
  string session_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  string requester = 4;               // as Attach.requester
}

message TerminalResized {
  string session_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
}

// PX-099: the terminal owner lease. A person attaching to a terminal takes
// the input lease; while one connection holds it the agent's stdin writes
// are refused INPUT_LEASED and no other connection's user input is accepted.
// Only the host (empty requester, the Core speaking for a person) may take
// it. The lease ends with `ReleaseInputLease`, with the holding connection,
// and with the session.
message AcquireTerminalLease {
  string session_id = 1;
  string requester = 2;               // as Attach.requester
  string holder = 3;                  // who the Core says holds it (`user:<client>`), for the record
  bool steal = 4;                     // take it from another person's connection
}

message ReleaseTerminalLease {
  string session_id = 1;
  string requester = 2;               // as Attach.requester
}

message TerminalLeaseState {
  string session_id = 1;
  bool held = 2;                      // whether the requesting connection now holds it
  string holder = 3;                  // the current holder, "" = nobody
}

message StdinWritten {
  string session_id = 1;
  uint64 bytes = 2;
  uint64 cursor = 3;                  // the log's head when the write was made
}

message Cancel {
  string session_id = 1;
  string requester = 2;               // FIX-20, as Attach.requester
}

message ListSessions {
  // FIX-20: a task is listed only the sessions it owns; empty = the host,
  // which is listed all of them.
  string requester = 1;
}

// EPR-018: whether this host confines review processes, and how.
message ProbeSandbox {}

message SandboxProbed {
  bool available = 1;
  string kind = 2;                    // seatbelt | seccomp-net | ""
  string detail = 3;
}

message SessionInfo {
  string session_id = 1;
  string request_id = 2;
  repeated string argv = 3;
  bool running = 4;
  uint64 bytes_so_far = 5;
  optional int32 exit_code = 6;
  // RUNNING | EXITED | LOST (M4.5): LOST is a session whose process died with
  // a previous broker; its output log is durable and replayable, its exit
  // unknown.
  string status = 7;
  uint64 replay_generation = 8;       // the newest attach generation seen
  int64 started_at_ms = 9;
  string cwd = 10;                    // EPR-018: a review environment ends its processes by it
  string owner = 11;                  // FIX-20: the owning principal ("" = host)
  uint64 oldest_cursor = 12;          // FIX-20: the oldest cursor still replayable
  // PX-099 (field block 120-139).
  bool pty = 120;
  uint32 pty_rows = 121;
  uint32 pty_cols = 122;
  string input_lease_holder = 123;    // "" = nobody holds the input lease
  uint64 duration_ms = 124;           // 0 while running
  bool cancelled = 125;
  bool timed_out = 126;
  string output_ref = 127;            // once exited
  uint64 replay_window_bytes = 128;   // the broker's replay window per session
  bool lost = 129;
}

message SessionList {
  repeated SessionInfo sessions = 1;
}

message ExecError {
  string request_id = 1;
  string code = 2;
  string message = 3;
}

message ExecFrame {
  oneof body {
    ClientHello client_hello = 1;
    HelloAck hello_ack = 2;
    ExecRequest exec = 3;
    ExecStarted started = 4;
    OutputChunk output = 5;
    ProcessExited exited = 6;
    Attach attach = 7;
    WriteStdin stdin = 8;
    Cancel cancel = 9;
    ListSessions list = 10;
    SessionList sessions = 11;
    ExecError error = 12;
    ProbeSandbox probe_sandbox = 13;
    SandboxProbed sandbox_probed = 14;
    // PX-099 (field block 120-139).
    TerminalAck ack = 120;
    TerminalResize resize = 121;
    TerminalResized resized = 122;
    AcquireTerminalLease acquire_lease = 123;
    ReleaseTerminalLease release_lease = 124;
    TerminalLeaseState lease_state = 125;
    StdinWritten stdin_written = 126;
    // PX-132 (field block 320-339).
    ListServices list_services = 320;
    SessionListeners service_listeners = 321;
  }
}
