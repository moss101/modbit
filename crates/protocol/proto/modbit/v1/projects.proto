// Projects over the WorkGraph (REQ-PX-063; docs/62, docs/65 AFW-J01..J04).
//
// A Project is a named, archivable record bound to one workspace, with an
// external membership map from task to project. It is a grouping: it carries
// no coordinator behaviour, schedules nothing and owns no task, and archiving
// it changes the record and nothing else. The record and the map are
// projections of `Project` aggregate events (crates/domain/src/project.rs);
// every command is fenced by the acting session's lease and idempotent per
// command id.
//
// The field this file adds to an existing message (`AgentHeader.project_id`
// in stream.proto) uses the block 420-439.
//
// Typed refusals (CommandAck.error_code): PROJECT_NAME_INVALID,
// PROJECT_NAME_TAKEN, PROJECT_COLOR_INVALID, PROJECT_ICON_INVALID,
// PROJECT_LIMIT, UNKNOWN_PROJECT, PROJECT_ARCHIVED, PROJECT_FULL,
// UNKNOWN_TASK, TASK_NOT_TOP_LEVEL, TASK_IS_DRAFT, WORKSPACE_MISMATCH,
// IN_ANOTHER_PROJECT, NOT_A_MEMBER.
syntax = "proto3";

package modbit.v1;

import "modbit/v1/domain.proto";
import "modbit/v1/stream.proto";

// Create a project bound to a workspace. The name is unique among the live
// projects of the workspace; colour and icon are roles and names of the
// design-token set (empty = the default). `workspace_root` is the checkout
// the project groups tasks of.
message CreateProject {
  Id session_id = 1;              // the acting session; its lease fences the command
  string name = 2;
  string color = 3;
  string icon = 4;
  string workspace_root = 5;
}

// Rename a project and/or change its colour and icon. An empty field keeps
// what the project has. The workspace never changes.
message RenameProject {
  Id session_id = 1;
  Id project_id = 2;
  string name = 3;
  string color = 4;
  string icon = 5;
}

// Archive a project (true) or bring it back (false). Its tasks are not
// archived, stopped or removed from it.
message ArchiveProject {
  Id session_id = 1;
  Id project_id = 2;
  bool archived = 3;
}

// Add a top-level task of the project's workspace to it. A task in another
// project is refused (IN_ANOTHER_PROJECT): remove it from there first.
message AddProjectMember {
  Id session_id = 1;
  Id project_id = 2;
  Id task_id = 3;
}

// Take a task out of the project. The task is untouched.
message RemoveProjectMember {
  Id session_id = 1;
  Id project_id = 2;
  Id task_id = 3;
}

message ListProjects {
  string workspace_root = 1;      // optional: only this workspace's projects
  bool include_archived = 2;
}

message GetProject {
  Id project_id = 1;
}

// The tasks of a project by status class, as the agent list classifies them.
message ProjectStatusCount {
  AgentStatusClass status_class = 1;
  string label = 2;
  uint32 count = 3;
}

// A pull request a member task opened and what CI said about it. Present
// only when the log holds the pull request; the CI counts are those of the
// latest CiEvidenceRecorded for it, never inferred.
message ProjectPullRequestView {
  uint64 number = 1;
  string url = 2;
  string head = 3;
  string state = 4;               // "" | the forge's state after the latest update
  bool has_ci = 5;                // CI evidence was recorded
  uint32 checks_passed = 6;
  uint32 checks_failed = 7;
  uint32 checks_pending = 8;
}

message ProjectMemberView {
  Id task_id = 1;
  Id session_id = 2;
  string title = 3;
  AgentStatusClass status_class = 4;
  string status_label = 5;
  bool unread = 6;
  bool pending_approval = 7;
  uint32 attention_items = 8;
  string task_state = 9;
  bool archived = 10;
  int64 added_at_ms = 11;
  int64 updated_at_ms = 12;
  ProjectPullRequestView pull_request = 13;  // absent when the task has none
}

// What a project's tasks add up to. Every figure is a count over the member
// headers the agent list uses; nothing is estimated.
message ProjectRollup {
  uint32 members = 1;
  repeated ProjectStatusCount by_status = 2;   // classes with at least one task, in the list's order
  uint32 attention_tasks = 3;     // members that need attention
  uint32 attention_items = 4;     // the attention items across members
  uint32 pending_approvals = 5;
  uint32 unread = 6;
  uint32 pull_requests = 7;
  uint32 ci_passing = 8;          // pull requests whose recorded CI all passed
  uint32 ci_failing = 9;
  uint32 ci_pending = 10;
}

message ProjectView {
  Id project_id = 1;
  string name = 2;
  string color = 3;
  string icon = 4;
  string workspace_root = 5;
  bool archived = 6;
  int64 created_at_ms = 7;
  int64 updated_at_ms = 8;
  uint64 created_offset = 9;
  uint64 last_offset = 10;
  ProjectRollup rollup = 11;
  repeated ProjectMemberView members = 12;
}

message ProjectList {
  repeated ProjectView projects = 1;
  uint64 last_offset = 2;
}

// The answer to every project command: the project as it is now. `offset` is
// where the change was recorded; 0 when the project was already in the state
// asked for and nothing was recorded.
message ProjectChanged {
  ProjectView project = 1;
  uint64 offset = 2;
}

// ---- Removing one worktree (PX-068; docs/65 AFW-J07) ----
//
// The cleanup removes worktrees by retention caps. A person who looks at the
// worktree list and decides one is not needed asks for that one by id; the
// Core applies the same eligibility rule the cleanup does, under the same
// single lease, and a worktree that is not eligible is refused with a typed
// reason and left alone: TASK_RUNNING (its task has not ended),
// WORKTREE_PROTECTED (younger than the protection window),
// WORKTREE_NEEDS_DECISION (dirty or unapplied: apply, merge or discard it
// first), WORKTREE_NOT_REMOVABLE (any other reason, named), UNKNOWN_WORKTREE,
// CLEANUP_LEASE_HELD.
message RemoveWorktree {
  Id session_id = 1;              // the acting session; its lease fences the command
  string worktree_id = 2;
  bool dry_run = 3;               // decide and say what would be lost; remove nothing
}

message WorktreeRemoval {
  string worktree_id = 1;
  bool removed = 2;               // false for a dry run
  bool dry_run = 3;
  string branch = 4;
  string path = 5;
  uint64 bytes = 6;               // bytes the removal frees (or freed)
  string reason = 7;              // why it is removable, in the Core's words
  repeated string loses = 8;      // what the removal takes with it, one line each
  uint64 offset = 9;              // where the removal was recorded; 0 for a dry run or an orphan
}
