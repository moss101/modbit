// Local SurfaceProtocol frames (docs/30 "Local SurfaceProtocol"). One
// SurfaceFrame per length-prefixed wire frame (crates/protocol framing).
// Commands carry the canonical CommandEnvelope; the payload of each command
// type is the matching message below encoded into `payload`.
syntax = "proto3";

package modbit.v1;

import "google/protobuf/timestamp.proto";
import "modbit/v1/domain.proto";
import "modbit/v1/envelope.proto";
import "modbit/v1/negotiation.proto";

// Authentication sent with Hello: the boot-scoped secret the client obtained
// from the Core it spawned (docs/30). Never logged, never persisted.
message Auth {
  bytes boot_secret = 1;
}

message ClientHello {
  Hello hello = 1;
  Auth auth = 2;
}

// Command payloads (M1.3 subset; docs/30 command list).
message CreateSession {
  Id space_id = 1;
}

message CreateTask {
  Id session_id = 1;
  string goal_text = 2;
  Id workspace_id = 3;
  string execution_profile = 4;
  string origin = 5;  // desktop | cli | ide_adapter | forge_issue | forge_webhook
  string workspace_root = 6;  // canonical path of the user-approved workspace (empty = general Work space)
}

message GetSessionSnapshot {
  Id session_id = 1;
}

message SubscribeEvents {
  Id session_id = 1;
  // Deliver events with offset > after_offset, then live events.
  uint64 after_offset = 2;
}

// Command acknowledgement.
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;
  COMMAND_STATUS_REPLAYED = 2;     // idempotent replay of an earlier command_id
  COMMAND_STATUS_REJECTED = 3;     // typed error in `error`
}

message CommandAck {
  Id command_id = 1;
  CommandStatus status = 2;
  string error_code = 3;
  string error_message = 4;
  // Result payload: SessionCreated / TaskCreated / SessionSnapshot encoded bytes.
  bytes result = 5;
}

message SessionCreated {
  Id session_id = 1;
  uint64 offset = 2;
}

message TaskCreated {
  Id task_id = 1;
  uint64 offset = 2;
}

message TaskView {
  Id task_id = 1;
  string goal_text = 2;
  string state = 3;
  uint64 generation = 4;
  google.protobuf.Timestamp created_at = 5;
}

message SessionSnapshot {
  Id session_id = 1;
  string state = 2;
  uint64 generation = 3;
  repeated TaskView tasks = 4;
  // Highest event offset included in this snapshot; subscribe after it.
  uint64 last_offset = 5;
  // The session kernel lease (docs/13, docs/33; M4.4): a client of the same
  // owner presents lease_generation to act under the current lease instead
  // of taking it over; 0 = no lease acquired yet.
  uint64 lease_generation = 6;
  string lease_owner = 7;
}

// A stored event delivered to a subscriber.
message StoredEventFrame {
  uint64 offset = 1;
  EventEnvelope event = 2;
}

// Transport-level error (protocol violation); the connection closes after it.
message ProtocolError {
  string code = 1;
  string message = 2;
}

message SurfaceFrame {
  oneof body {
    ClientHello client_hello = 1;
    HelloAck hello_ack = 2;
    CommandEnvelope command = 3;
    CommandAck command_ack = 4;
    SubscribeEvents subscribe = 5;
    StoredEventFrame event = 6;
    ProtocolError error = 7;
  }
}

// Startup recovery report (M1.5, docs/19 "Resume algorithm", docs/33 step 11:
// CoreReady only after recovery). Served by GetRecoveryReport; the desktop
// recovery banner shows what the Core actually recovered, never invented progress.
message GetRecoveryReport {}

message RecoveryReport {
  // Monotonic per-data-directory Core start counter (fencing base).
  uint64 boot_generation = 1;
  google.protobuf.Timestamp started_at = 2;
  uint64 last_offset = 3;
  uint64 events_verified = 4;
  uint64 aggregates_verified = 5;
  bool projections_rebuilt = 6;
  uint64 sessions = 7;
  uint64 tasks = 8;
  // Empty when the store was clean; otherwise what recovery had to do.
  repeated string notes = 9;
  uint64 recovery_ms = 10;
}

// Session kernel lease (REQ-EV-0054 / REQ-EV-0273; docs/13 fencing, docs/33
// "Session kernel lease"). The single mutation owner presents the current
// generation in `CommandEnvelope.expected_generation`; a stale writer is
// rejected with STALE_LEASE. Acquiring always mints a strictly greater
// generation, so a previous owner is fenced out even across a Core restart.
message AcquireSessionLease {
  Id session_id = 1;
  string owner = 2;
}

message SessionLeaseAcquired {
  Id session_id = 1;
  uint64 lease_generation = 2;
  uint64 offset = 3;
}

// Durable, ordered user input on a task (REQ-EV-0262; MOD-INPUT-001 typed
// STEER / COLLECT / FOLLOW_UP). Requires the session lease.
message QueueInput {
  Id task_id = 1;
  string input_id = 2;   // client-stable; retries replay
  string mode = 3;       // STEER | COLLECT | FOLLOW_UP
  string text = 4;
}

message InputQueued {
  Id task_id = 1;
  uint64 sequence = 2;
  uint64 offset = 3;
}

// Bounded range read of a content-addressed object (docs/30 "OutputRef API",
// REQ-EV-0108): the whole object is never sent in one frame.
message ReadObjectRange {
  string object_hash = 1;
  uint64 offset = 2;
  uint64 length = 3;     // capped at MAX_OBJECT_CHUNK (1 MiB)
}

message ObjectRangeChunk {
  string object_hash = 1;
  uint64 total_bytes = 2;
  uint64 offset = 3;
  bytes data = 4;
  bytes checksum_sha256 = 5;  // of the whole object
}

// Direct tool invocation through the registry, policy and event loop (M2.4,
// docs/16 "Tool completion proof"). The Core records ToolCall events and
// returns the docs/30 ToolCallResult. Requires the session lease.
message InvokeTool {
  Id task_id = 1;
  string tool_name = 2;          // namespace.name from the canonical inventory (docs/17)
  string arguments_json = 3;
  Id tool_call_id = 4;           // client-stable; retries replay
  uint64 output_budget_bytes = 5;
}

message ToolInvoked {
  Id tool_call_id = 1;
  string status = 2;             // SUCCESS | APPLICATION_FAILURE | INFRA_FAILURE | CANCELLED | UNKNOWN_OUTCOME | POLICY_DENIED | INVALID_ARGUMENTS
  string structured_output_json = 3;
  string stdout_ref = 4;         // object hash when spilled
  string error_code = 5;
  string error_message = 6;
  uint64 workspace_revision_after = 7;
  string result_ref = 8;         // object hash of the full ToolCallResult JSON
  string approval_id = 9;        // hex; set when status is APPROVAL_PENDING or an approval was consumed
  repeated string effect_receipt_ids = 10; // hex effect ids appended to the receipt chain (docs/23)
}

// REQ-EV-0096/0133: without a task the host-supported surface; with a task the
// surface compiled from support x policy (profile, lease, admin denies).
message ListTools {
  Id task_id = 1;
}

message ToolSpecView {
  string name = 1;
  string version = 2;
  string effect_class = 3;
  string input_schema_json = 4;
  string description = 5;
}

message ToolList {
  repeated ToolSpecView tools = 1;
}

// ---- M2.5 Capability Kernel + approval flow (docs/23) ----

message ListApprovals {
  Id session_id = 1;
}

message ApprovalView {
  Id approval_id = 1;
  Id task_id = 2;
  Id tool_call_id = 3;
  string tool_name = 4;
  string effect_class = 5;
  string intent_hash = 6;        // sha256 of the normalized arguments the approval binds
  string scope_json = 7;
  string status = 8;             // REQUESTED | APPROVED | DENIED | EXPIRED
  int64 requested_at_ms = 9;
  int64 expires_at_ms = 10;      // 0 = never
  string resolver = 11;
}

message ApprovalList {
  repeated ApprovalView approvals = 1;
}

message ResolveApproval {
  Id approval_id = 1;
  bool approve = 2;
  string reason = 3;
}

message ApprovalResolvedAck {
  Id approval_id = 1;
  string status = 2;
  uint64 offset = 3;
}

message EmergencyStop {
  Id session_id = 1;
  string reason = 2;
}

message EmergencyStopped {
  uint32 leases_revoked = 1;
  uint64 offset = 2;
}

message GetEffectReceipts {
  Id task_id = 1;                // absent = the whole chain
}

message EffectReceiptView {
  Id effect_id = 1;
  string previous_receipt_hash = 2;
  Id task_id = 3;
  Id tool_call_id = 4;
  Id capability_lease_id = 5;
  string intent_hash = 6;
  string policy_decision = 7;
  Id approval_id = 8;
  string execution_target = 9;
  string evidence_ref = 10;
  string status = 11;
  int64 occurred_at_ms = 12;
  string receipt_hash = 13;
}

message EffectReceiptList {
  repeated EffectReceiptView receipts = 1;
  bool chain_valid = 2;          // every hash recomputes and links to its predecessor
  string detail = 3;
}

// REQ-EV-0064/0065: typed undo of one tool call's file changes. `apply=false`
// returns the plan only; `apply=true` applies it when every path still has
// its post-edit content (a user edit after the change refuses the revert).
message UndoToolCall {
  Id task_id = 1;
  Id tool_call_id = 2;
  bool apply = 3;
}

message UndoStepView {
  string path = 1;
  string action = 2;               // delete | restore | replace
  string expected_content_hash = 3;
  bool expect_absent = 4;
  string restore_ref = 5;          // object hash of the content to restore
  string resulting_hash = 6;
}

message UndoRefusal {
  string path = 1;
  string code = 2;                 // USER_EDITED | PATH_PRESENT | PATH_MISSING | STEP_FAILED
  string detail = 3;
}

message UndoPlanView {
  Id tool_call_id = 1;
  repeated UndoStepView steps = 2;
  bool applied = 3;
  repeated UndoRefusal refusals = 4;
  uint64 workspace_revision = 5;
}

// REQ-EV-0261: a side question answered from a bounded snapshot of the task
// (goal, plan, recent transcript) without touching the task's state or log.
message AskSideQuestion {
  Id task_id = 1;
  string text = 2;
  string endpoint = 3;            // empty = the run's defaults
  string model = 4;
}

message SideAnswer {
  string text = 1;
  string route_json = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 last_offset = 5;         // the log offset, unchanged by the question
  uint32 snapshot_messages = 6;   // how many transcript messages the snapshot carried
}

// REQ-EV-0222 / PX-000: typed questions. The run suspends on `user.ask`;
// RespondToQuestion records the answer (StartTask then resumes the run).
message ListQuestions {
  Id task_id = 1;
}

message QuestionOptionView {
  string id = 1;
  string label = 2;
}

message QuestionView {
  string question_id = 1;
  string call_id = 2;
  string question = 3;
  repeated QuestionOptionView options = 4;
  bool allow_free_text = 5;
  string reason = 6;
  repeated string flags = 7;
  bool answered = 8;
  string option_id = 9;
  string text = 10;
}

message QuestionList {
  repeated QuestionView questions = 1;
}

message RespondToQuestion {
  Id task_id = 1;
  string question_id = 2;
  string option_id = 3;           // one of the question's options, or empty
  string text = 4;                // free text when the question allows it
}

message QuestionResponded {
  string question_id = 1;
  bool already_answered = 2;
}

// REQ-EV-0190: ingest a channel attachment (desktop, CLI, API) through the
// media pipeline; the result is the same canonical MediaEnvelope a workspace
// read produces, stored by digest, and an AttachmentIngested event.
message IngestAttachment {
  Id task_id = 1;
  string filename = 2;
  string channel = 3;             // desktop | cli | api
  bytes data = 4;                 // bounded by the frame limit (4 MiB)
}

message AttachmentIngested {
  string attachment_id = 1;       // sha256 of the bytes
  string envelope_json = 2;       // the MediaEnvelope
  string kind = 3;
  string mime = 4;
  string content_ref = 5;
  uint64 offset = 6;              // log offset of the AttachmentIngested event
  bool replayed = 7;              // the same bytes were ingested before for this task
}

message GetCapabilityLeases {
  Id task_id = 1;
}

message CapabilityLeaseView {
  Id lease_id = 1;
  Id task_id = 2;
  repeated string resources = 3;
  repeated string operations = 4;
  string effect_ceiling = 5;
  string execution_profile = 6;
  uint64 generation = 7;
  string status = 8;             // ACTIVE | REVOKED
  string revoke_reason = 9;
}

message CapabilityLeaseList {
  repeated CapabilityLeaseView leases = 1;
}

// ---- Context Inspector (REQ-EV-0035 / 0131 / 0175, docs/18) ----

message GetContextInspector {
  Id task_id = 1;
}

// One fragment the Context Pack selected, as the clients show it.
message ContextEntryView {
  string entry_id = 1;
  string source_ref = 2;
  string path = 3;
  uint32 line_start = 4;          // 0 = whole file
  uint32 line_end = 5;
  string reason = 6;              // critical:<why> | utility
  repeated string retrieval_reasons = 7;
  repeated string sources = 8;    // exact | lexical | semantic | graph.* | task_constraint
  string freshness = 9;           // committed | fresh_in_worktree | rehydrated_from_active_revision
  uint32 token_cost = 10;
  string content_hash = 11;
  uint64 workspace_revision = 12;
  bool stub = 13;                 // signature-only, hydrate to read it
  bool injected = 14;             // reached the prompt envelope this turn
  bool used = 15;                 // a later tool call used the path at that revision
  // What the product claims about this file's language (PX-029): a Tier C or
  // unsupported entry carries no structural claim, and says so.
  LanguageStateView language_state = 16;
}

message ContextInspectorView {
  string pack_id = 1;
  uint64 workspace_revision = 2;
  uint32 token_budget = 3;
  uint32 token_used = 4;
  bool complete = 5;              // every critical entry fit
  repeated ContextEntryView entries = 6;
  uint32 omitted_count = 7;
  uint32 omitted_tokens = 8;
  repeated string omitted_paths = 9;
  string compiler_version = 10;
  string token_estimator = 11;
  // What the prompt envelope did with them on the last compiled turn.
  string context_pack_id = 12;
  repeated string injected_refs = 13;
  repeated string rejected_refs = 14;
  uint64 injected_tokens = 15;
  // Compaction epochs and the prompt-cache prefix they move (docs/19;
  // REQ-EV-0056 / 0092 / 0111 / 0268). The manifest is a stored object: read
  // it with ReadObject to see the facts an epoch preserved.
  uint32 compaction_epoch = 16;      // installed epoch; 0 = nothing compacted yet
  uint32 compaction_epochs = 17;     // epochs opened on this task
  uint64 compacted_entries = 18;     // transcript entries summarised away
  string manifest_ref = 19;          // the installed epoch's manifest
  uint32 prefix_cache_hits = 20;     // turns that reused the previous stable prefix
  uint32 prefix_cache_misses = 21;   // turns that changed it (the first, then each epoch)
  // The selection retrieval is preferring (REQ-EV-0141 / 0160).
  repeated string selection_paths = 22;
  string selection_symbol = 23;
  string selection_source = 24;
  repeated string selection_review_hunks = 25;
  // Compaction requests (docs/19 "Compaction epochs", docs/31 compaction_epochs; M4.2).
  repeated CompactionRequestView compactions = 26;
}

message CompactionRequestView {
  string compaction_id = 1;
  uint32 epoch = 2;
  uint64 branch_generation = 3;
  string status = 4;               // PENDING | COMMITTED | REJECTED
  string mode = 5;                 // ASYNC | SYNC_FALLBACK
  uint64 source_event_start = 6;
  uint64 source_event_end = 7;
  uint32 source_entries = 8;
  string result_object_hash = 9;   // the manifest, once committed
  string rejection = 10;           // "<reason>: <detail>", once rejected
  int64 created_at_ms = 11;
  int64 committed_at_ms = 12;      // 0 while pending
}

// ---- Verified-outcome baseline (REQ-EPR-000, docs/27) ----

// Publish a fixed-revision baseline of the direct path for this session: what
// each task cost and whether it was verified, pinned to the build, the
// repository revision and the environment that produced it.
message PublishOutcomeBaseline {
  Id session_id = 1;
  string repository_revision = 2;  // as the caller pins it (a Git revision)
}

message OutcomeBaselinePublished {
  string bundle_digest = 1;
  string bundle_ref = 2;           // object hash; read it with ReadObjectRange
  uint32 tasks = 3;
  uint32 verified_tasks = 4;
  uint32 tasks_with_unknown_usage = 5;
  string build_digest = 6;
  string environment_digest = 7;
  uint64 offset = 8;
}

// ---- Language degradation (REQ-PX-029, docs/76) ----

// Allow this task to edit files in languages the product claims no tier for.
// Without it those edits are refused; with it they carry the provenance.
message AllowUnsupportedLanguage {
  Id task_id = 1;
  repeated string languages = 2;  // language labels, or "*" for any
  string reason = 3;
}

message UnsupportedLanguageAllowed {
  uint64 offset = 1;
  repeated string languages = 2;
}

// What the product may claim about one path's language.
message LanguageStateView {
  string path = 1;
  string language = 2;
  string tier = 3;            // A | B | C | "" when nothing is claimed
  bool structural = 4;        // symbols and AST anchors are claimed
  bool needs_opt_in = 5;      // an edit needs the user's per-task opt-in
  string label = 6;
  repeated string degradation = 7;
}

// ---- Connected engineering context (REQ-EV-0161, docs/18) ----

// An approved spec, issue or design document brought into a task. It becomes
// labelled context with provenance; it grants nothing.
message AttachContextDocument {
  Id task_id = 1;
  string source = 2;   // issue:PROJ-1 | spec:... | a URL, as the user names it
  string title = 3;
  string text = 4;     // the document, already fetched by the client
}

message ContextDocumentAttached {
  string document_id = 1;   // sha256 of the text
  string content_ref = 2;
  uint64 offset = 3;
  string trust = 4;         // UNTRUSTED_EXTERNAL_CONTENT
  bool replayed = 5;
}

// ---- Workspace context bridge (REQ-EV-0141 / 0160, docs/18) ----

// What the user currently has selected. Context, never authority: a selection
// grants no tool and no write, it only tells retrieval what to prefer.
message SetTaskSelection {
  Id task_id = 1;
  repeated string paths = 2;      // root-relative
  string symbol = 3;              // optional symbol name
  uint32 line_start = 4;          // 1-based, 0 = whole file
  uint32 line_end = 5;
  repeated string review_hunks = 6;  // path#index
  string source = 7;              // review | editor | cli | desktop
}

message TaskSelectionRecorded {
  uint64 offset = 1;
}

// ---- Context efficiency metrics (REQ-EV-0173, docs/18 "Context economy") ----

message GetTaskEconomics {
  Id task_id = 1;
}

// What one task cost and what it bought, counted from the canonical log.
message TaskEconomicsView {
  string task_id = 1;
  string state = 2;
  // Quality: did the work actually verify?
  bool verified = 3;               // a COMPLETION run passed AND it ran at least one check
  uint32 checks_passed = 4;
  uint32 checks_failed = 5;
  reserved 6;
  // Economics.
  uint32 model_calls = 7;
  uint64 input_tokens = 8;
  uint64 cached_input_tokens = 9;  // of input_tokens, the part the provider reported cached
  uint64 output_tokens = 10;
  double cost_usd = 11;            // catalog list prices, no cache discount applied
  uint32 tool_calls = 12;
  uint64 wall_ms = 13;             // first to last event of the task
  uint64 model_ms = 14;            // time inside model invocations
  uint64 tool_ms = 15;             // time inside tool calls
  // Context economy: what the pack, the prefix cache and compaction did.
  uint32 prefix_cache_hits = 16;
  uint32 prefix_cache_misses = 17;
  uint32 compaction_epochs = 18;
  uint64 compacted_entries = 19;
  uint64 context_tokens_injected = 20;
  uint32 pricing_known = 21;       // 1 when the catalog priced every call
  string model = 22;               // the model the calls routed to
  // PASSED | NO_CHECKS | FAILED | NOT_RUN — the COMPLETION run's own verdict,
  // so "verified" is never a claim the run did not make.
  string verification = 23;
  uint32 regressions = 24;         // checks the completion run attributed to this change
}

// ---- PX-026 language support labels (docs/76) ----

message ListLanguages {}

// What the product claims for a language today, and what it does not.
message LanguageSupportView {
  string language = 1;              // typescript | javascript | python | rust | *
  string tier = 2;                  // ALPHA_BASELINE | UNSUPPORTED (Tier A/B/C arrive with PX-027/028)
  string label = 3;                 // human label shown by every client
  string fixture = 4;               // the real fixture repository the claims are proven on
  repeated string proven = 5;       // capabilities proven at this tier
  repeated string provisional = 6;  // available but not yet a tier claim
  repeated string not_claimed = 7;  // explicitly not claimed
  repeated string evidence_tests = 8; // named tests behind the proven claims
  string note = 9;
  // What the tier conformance suites recorded for this language (PX-027): the
  // tier a recorded run earned, or that no suite has run. A tier claim without
  // a recorded pass is a release blocker (docs/76).
  string conformance = 10;
}

message LanguageList {
  repeated LanguageSupportView languages = 1;
}

// ---- M2.6 Provider Gateway (docs/15) ----

message ListModels {}

message ModelCapabilityView {
  string endpoint = 1;
  string provider = 2;           // openai | anthropic
  string model = 3;
  uint32 context_tokens = 4;
  uint32 max_output_tokens = 5;
  bool tools = 6;
  bool vision = 7;
  bool reasoning = 8;
  bool structured_output = 9;
  repeated string input_modalities = 10;
  bool credential_available = 11;
  string blocked_by_policy = 12;   // REQ-EV-0031: the organization rule blocking it, empty when allowed
}

message EndpointHealthView {
  string endpoint = 1;
  uint64 requests = 2;
  uint64 successes = 3;
  uint64 failures = 4;
  uint64 interruptions = 5;
  uint64 cancellations = 6;
  uint64 rate_limited = 7;
  uint64 last_first_token_ms = 8; // 0 = none yet
}

message ModelList {
  repeated ModelCapabilityView models = 1;
  repeated EndpointHealthView health = 2;
}

// Conformance probe: one real streaming call through the gateway (REQ-EV-0028).
message ProbeModel {
  string endpoint = 1;
  string model = 2;
  string prompt = 3;
  bool with_tools = 4;           // project a scratch tool and expect a typed tool call
  uint64 timeout_ms = 5;
}

message ModelProbed {
  string status = 1;             // COMPLETED | ERROR | ROUTE_REFUSED
  string text = 2;
  string stop_reason = 3;
  string error_code = 4;
  string error_message = 5;
  string route_json = 6;         // RouteRecord: requested vs resolved (REQ-EV-0112)
  uint64 input_tokens = 7;
  uint64 output_tokens = 8;
  uint64 cached_input_tokens = 9;
  string tool_call_name = 10;
  string tool_call_arguments_json = 11;
  uint32 events = 12;
}

// ---- M2.7 one-agent runtime (docs/14) ----

message StartTask {
  Id task_id = 1;
  string endpoint = 2;           // gateway endpoint; empty = MODBIT_DEFAULT_ENDPOINT or the first registered
  string model = 3;              // empty = MODBIT_DEFAULT_MODEL or the endpoint's first model
  uint32 max_turns = 4;          // 0 = Alpha default (60)
  uint32 max_tool_calls = 5;     // 0 = Alpha default (300)
  uint32 max_no_progress_turns = 6; // 0 = Alpha default (3)
}

message TaskRunStarted {
  Id run_id = 1;
  bool resumed = 2;
  string endpoint = 3;
  string model = 4;
}

message CancelTask {
  Id task_id = 1;
}

message TaskCancelRequested {
  bool was_running = 1;
}

message GetTaskStatus {
  Id task_id = 1;
}

message TaskStatus {
  string state = 1;              // Task state
  string wait_reason = 2;
  string run_state = 3;          // latest run, empty if none
  bool loop_alive = 4;           // the agent loop is executing in this Core
  uint64 last_offset = 5;
  // REQ-EV-0073: the latest TaskNeedsAttention, typed. Empty when the
  // task has never needed attention.
  string attention_reason = 6;
  string failure_class = 7;      // TIMEOUT | INFRASTRUCTURE | APPLICATION | POLICY | APPROVAL | CORRUPT_STATE | UNKNOWN_OUTCOME | LEASE | PROVIDER | BUDGET | HARNESS | CANCELLED | INVALID
  string failure_code = 8;       // stable code within the class
  bool retryable = 9;            // a retry of the same operation can succeed
  string user_action = 10;       // what only the user can do (empty when nothing)
  string recovery_path = 11;     // how the system recovers
  repeated string evidence_refs = 12; // object hashes / ids that prove the failure
  repeated string diagnostic_features = 13; // stable feature tags (REQ-EV-0245)
}

// ---- M2.9 Trusted Code Review Surface (docs/20) ----

message GetReviewBundle {
  Id task_id = 1;
}

message HunkView {
  uint32 index = 1;
  string header = 2;
  uint32 old_start = 3;
  uint32 old_lines = 4;
  uint32 new_start = 5;
  uint32 new_lines = 6;
  repeated string lines = 7;     // unified lines with their prefix
}

message ReviewFile {
  string path = 1;
  string status = 2;             // A | M | D | R
  bool binary = 3;
  string old_content_ref = 4;    // object hash of the base text (empty for new files)
  string new_content_ref = 5;    // object hash of the candidate text (empty for deletions)
  string file_revision = 6;      // sha256 of the candidate content (the CodeReference file revision)
  repeated HunkView hunks = 7;
}

message VerificationRunView {
  string verification_run_id = 1;
  string stage = 2;
  string status = 3;
  string candidate_revision = 4;
  repeated string report_refs = 5;
  repeated string check_ids = 6;
  repeated string check_statuses = 7;
}

message ReviewBundle {
  Id task_id = 1;
  string task_state = 2;
  uint64 workspace_revision = 3;
  string base_commit = 4;
  string workspace_root = 5;
  repeated ReviewFile files = 6;
  string plan_json = 7;
  string self_review_json = 8;
  repeated VerificationRunView verification_runs = 9;
  repeated string attributions = 10;   // "check_id=ATTRIBUTION"
  repeated string quarantined = 11;
  repeated string invariant_findings = 12; // "DI-n CLASS path: evidence"
  uint32 receipts = 13;
  repeated string evidence_links = 14;     // "kind:ref" (report, raw output, receipt, event offset)
}

message GetCodeView {
  Id task_id = 1;
  string path = 2;
  string expected_file_revision = 3; // optional: STALE when the file moved on
}

message CodeViewModel {
  uint64 workspace_revision = 1;
  string file_revision = 2;
  string path = 3;
  string content_ref = 4;
  string syntax_language = 5;
  repeated uint32 changed_ranges = 6; // pairs: start,end (1-based, inclusive) of candidate lines
  repeated string evidence_links = 7;
  bool stale = 8;
  string text = 9;                    // bounded inline text (≤ 256 KiB); larger files by content_ref
}

message HunkRef {
  string path = 1;
  uint32 index = 2;
}

message DecideReview {
  Id task_id = 1;
  string decision = 2;           // ACCEPT | RETURN
  repeated HunkRef rejected = 3;
  string note = 4;
  uint64 expected_workspace_revision = 5; // stale review is refused
}

message ReviewDecided {
  string task_state = 1;
  string commit = 2;
  repeated string reverted = 3;  // path#index
  uint64 workspace_revision = 4;
  uint64 offset = 5;
}

// ---- Routing state (REQ-EPR-001, docs/27 and docs/38) ----
//
// The durable state of how a run was routed. On the direct path this is the
// degenerate plan the product already executes: one solver slot, no branches.
// No credential and no endpoint URL ever appears here — a slot names its
// endpoint, and nothing more.

message GetRoutingPlan {
  Id task_id = 1;
}

message RoutingSlotView {
  string slot_id = 1;
  string predecessor = 2;          // empty for the initial slot
  string trigger = 3;              // INITIAL | QUALITY_REJECTED | REVIEW_REQUIRED | LEG_FAILED
  uint32 max_activations = 4;
  uint32 activations = 5;
  string endpoint = 6;             // the endpoint's name, never its URL or its credential
  string model = 7;
  string role = 8;                 // solver | reviewer | reviser
  uint64 timeout_ms = 9;
  uint32 max_output_tokens = 10;
  uint32 max_retries = 11;
  uint64 reserved_minor = 12;      // money in minor units of the plan's currency
}

message RoutingAttemptView {
  string slot_id = 1;
  uint32 attempt = 2;
  string outcome = 3;              // SUCCEEDED | FAILED | CANCELLED | INTERRUPTED
  bool usage_known = 4;            // false: the provider reported nothing, and the tokens below say nothing
  uint64 input_tokens = 5;
  uint64 output_tokens = 6;
  string provider_request_id = 7;  // the provider's own id, when it returned one
}

message RoutingPlanView {
  string plan_id = 1;
  uint32 schema_version = 2;
  uint64 routing_epoch = 3;
  uint64 lease_generation = 4;
  string content_digest = 5;       // the plan is sealed by its own content
  string plan_ref = 6;
  uint64 total_budget_minor = 7;
  string currency = 8;
  uint32 scale = 9;
  string legacy_source = 10;       // the legacy shape it was decoded from, when it was
  string path_label = 11;          // DIRECT — derived from what ran, never a template
  repeated RoutingSlotView slots = 12;
  repeated RoutingAttemptView attempts = 13;
  repeated string not_claimed = 14; // what this record does not claim
  RoutingAdmissionView admission = 15; // what admission decided (REQ-EPR-014)
}

// ---- Plan admission (REQ-EPR-014, docs/38 §5.2) ----
//
// A conditional plan is validated whole before anything dispatches from it.
// The plan travels as the JSON of the versioned domain contract, so there is
// one definition of it rather than two that can drift.

message AdmitRoutingPlan {
  Id task_id = 1;
  string plan_json = 2;            // a serialized ConditionalExecutionPlan (schema 2)
}

message RoutingAdmissionView {
  bool admitted = 1;
  string plan_id = 2;
  string validation_digest = 3;    // digest of exactly what was validated
  uint64 reserved_minor = 4;       // slots plus the verification reserve
  string currency = 5;
  uint32 scale = 6;
  uint64 routing_epoch = 7;
  string refusal_code = 8;         // empty when admitted
  string refusal_detail = 9;
  repeated RoutingActivationView activations = 10;
  // What confidence-adjusted feasibility said at admission (REQ-EPR-016).
  string feasibility = 11;         // FEASIBLE | QUALITY_FLOOR_INFEASIBLE | QUALITY_FLOOR_UNKNOWN
  uint32 quality_lcb_bp = 12;      // the plan's quality lower bound, in basis points
  string stats_version = 13;       // the snapshot the bound came from, or none
  string thresholds_version = 14;  // the threshold version it was measured against, or none
  bool target_met = 15;            // only a feasible plan may be described as meeting the target
}

message RoutingActivationView {
  string slot_id = 1;
  uint32 activation = 2;
  uint64 reserved_minor = 3;
}

// ---- Model Registry (REQ-EPR-002, docs/27 and docs/38) ----
//
// Configuration is not a release: a signed, versioned document activates the
// registry at runtime. No credential, no endpoint URL and no empirical
// workflow outcome ever appears here.

message ActivateModelRegistry {
  string signed_json = 1;          // a serialized SignedRegistry
}

message ModelRegistryView {
  bool active = 1;
  string registry_generation = 2;
  string stats_version = 3;        // a reference; the registry holds no statistics
  string key_id = 4;               // which trusted key signed it
  string document_digest = 5;
  int64 expires_at_ms = 6;
  repeated RegistryBindingView bindings = 7;
  string refusal_code = 8;         // empty when active
  string refusal_detail = 9;
}

message RegistryBindingView {
  string endpoint = 1;             // the endpoint's name, never its URL or its credential
  string provider = 2;
  string family = 3;
  string model = 4;
  repeated string roles = 5;
  uint32 context_tokens = 6;
  uint32 max_output_tokens = 7;
  bool tools = 8;
  bool vision = 9;
  bool structured_output = 10;
  uint64 input_per_mtok_minor = 11;
  uint64 output_per_mtok_minor = 12;
  string currency = 13;
  uint32 scale = 14;
  uint64 latency_p50_ms = 15;
  uint64 latency_p95_ms = 16;
  string data_residency = 17;
  bool retains_prompts = 18;
  bool revoked = 19;
}

message GetModelRegistry {}

// ---- Outcome statistics (REQ-EPR-015, docs/27 §21) ----
//
// Observations, not predictions, and a separate version from the registry so
// that changing one cannot rewrite the other.

message MaterializeOutcomeStatistics {
  Id session_id = 1;
  string stats_version = 2;
}

message GetOutcomeStatistics {
  Id session_id = 1;
  string stats_version = 2;          // empty: the most recent snapshot
}

message OutcomeStatisticsView {
  bool materialized = 1;
  string stats_version = 2;
  string snapshot_digest = 3;
  string snapshot_ref = 4;
  repeated string source_digests = 5;  // the baseline bundles it came from
  repeated string source_versions = 6; // "name=value": build, revision, registry generation
  uint32 samples = 7;
  repeated StatAggregateView aggregates = 8;
  string note = 9;
  string refusal_code = 10;
  string refusal_detail = 11;
}

message StatAggregateView {
  string key_id = 1;
  uint32 samples = 2;
  uint32 successes = 3;
  double mean = 4;
  double interval_low = 5;
  double interval_high = 6;
  uint64 mean_cost_minor = 7;
  bool cost_known = 8;               // false: no observation had a reported cost
  uint32 unknown_cost_samples = 9;
  uint64 mean_wall_ms = 10;
  bool low_confidence = 11;          // below the sample threshold: a prior, not evidence
}

// ---- Plan compilation (REQ-EPR-004, docs/38 §5) ----
//
// Compile the bounded conditional plan for a task's current run from the
// active signed registry, the session's pinned statistics and the mode floor,
// prevalidate every candidate before anything dispatches, and admit the one
// that feasibility and then expected complete cost select. Nothing here is a
// template: a label is earned by what runs.

message CompileRoutingPlan {
  Id task_id = 1;
  string pin_endpoint = 2;         // manual pin: only plans opened by this binding are considered
  string pin_model = 3;
  uint64 request_cap_minor = 4;    // the request's spending cap; 0 = the registry's auto floor ceiling
}

message RoutingCandidateView {
  string plan_id = 1;
  repeated string bindings = 2;    // "endpoint/model" per slot, in order
  uint64 worst_case_cost_minor = 3;
  uint64 expected_cost_minor = 4;
  uint32 quality_lcb_bp = 5;
  bool confident = 6;
  repeated string missing_evidence = 7;
  bool hard_eligible = 8;
  string ineligible_reason = 9;
}

message RoutingCompileView {
  bool compiled = 1;
  string plan_id = 2;
  string content_digest = 3;
  string input_digest = 4;         // identical inputs give an identical digest
  string selection_code = 5;       // FEASIBLE | QUALITY_FLOOR_INFEASIBLE
  bool target_met = 6;
  string registry_generation = 7;
  string stats_version = 8;
  string thresholds_version = 9;
  string compiler_version = 10;
  repeated RoutingCandidateView candidates = 11;
  repeated string exclusions = 12; // "plan: reason"
  RoutingAdmissionView admission = 13;
  string refusal_code = 14;
  string refusal_detail = 15;
}

// ---- Onboarding (REQ-PX-022, docs/39 "Onboarding") ----
//
// Provider setup, explicit scoped repository trust and starter tasks. The
// credential in ConfigureProvider is held by the Core process in memory only:
// it is never written to the log, the object store or a file, never echoed
// in any view, and the renderer never handles it — Electron main sends it
// from the OS keychain.

message ConfigureProvider {
  string provider = 1;             // openai | anthropic
  string api_key = 2;              // the credential; empty clears it
  string base_url = 3;             // optional: a compatible endpoint (empty = the provider's own)
}

message ProviderConfigured {
  string endpoint = 1;             // the endpoint name the Core registered
  bool credential_available = 2;
  repeated string models = 3;      // model ids the endpoint serves
}

message TrustRepository {
  Id session_id = 1;
  string workspace_root = 2;       // the root the user trusts, scoped exactly to it
  string scope = 3;                // "repository" (this root only)
}

message RepositoryTrusted {
  string workspace_root = 1;
  uint64 offset = 2;
}

message ListStarterTasks {
  string workspace_root = 1;
}

message StarterTaskView {
  string id = 1;
  string title = 2;
  string goal_text = 3;
  string stack = 4;                // rust | node | python | text
}

message StarterTaskList {
  repeated string stacks = 1;      // what the repository was detected as
  repeated StarterTaskView tasks = 2;
  bool trusted = 3;                // whether this session has trusted the root
}

// ---- M4.1 Protocol State (docs/19 layer 2, REQ-EV-0055) ----

message GetProtocolState {
  Id task_id = 1;
}

message PendingCallView {
  Id tool_call_id = 1;
  string tool_name = 2;
  string effect_class = 3;
  string phase = 4;                // PROPOSED | AWAITING_APPROVAL | IN_FLIGHT | UNKNOWN_OUTCOME
  string arguments_hash = 5;       // the intent
  string call_id = 6;              // the model's call id, when the call came from a run
  Id run_id = 7;
  string approval_id = 8;          // hex, when awaiting one
  string reason = 9;               // why the outcome is unknown, when it is
}

message PendingApprovalView {
  Id approval_id = 1;
  Id tool_call_id = 2;
  string tool_name = 3;
  string effect_class = 4;
  string intent_hash = 5;
  int64 expires_at = 6;            // millis since epoch; 0 = never
  bool expired = 7;
}

message ProtocolStateView {
  Id task_id = 1;
  string version = 2;              // reconstruction version
  string boundary = 3;             // TURN_START | EXECUTING | AWAITING_APPROVAL | AWAITING_ANSWER | RECONCILING
  repeated PendingCallView calls = 4;
  repeated PendingApprovalView approvals = 5;
  string question_id = 6;          // the open question, if any
  uint32 active_leases = 7;
  string digest = 8;               // sha256 of the canonical state
  repeated TerminalCursorView terminals = 9;   // durable handles and the cursors the run acknowledged (M4.5)
}

// A durable terminal handle and the last output cursor the run acknowledged
// (docs/19 "terminal session ID + last acknowledged output cursor"; M4.5).
message TerminalCursorView {
  string handle_id = 1;
  string request_id = 2;
  repeated string argv = 3;
  uint64 replay_generation = 4;
  uint64 last_acknowledged_cursor = 5;
  bool running = 6;
  string output_ref = 7;           // once exited
  int32 exit_code = 8;             // meaningful when exit_known
  bool exit_known = 9;
  string tool_call_id = 10;
}

// ---- M4.6 Unknown-outcome reconciliation by the user (docs/51 E2E-005, docs/19 resume step 6) ----

message ReconcileToolCall {
  Id task_id = 1;
  Id tool_call_id = 2;
  string resolution = 3;           // EFFECT_CONFIRMED (it happened; never repeat it) | EFFECT_ABSENT (it did not; a retry is safe)
  string note = 4;                 // what the user checked
}

message ToolCallReconciledAck {
  Id tool_call_id = 1;
  string resolution = 2;           // USER_CONFIRMED | USER_ABSENT
  uint64 offset = 3;
}

// ---- M4.3 Workspace checkpoints (docs/19 "Checkpoint epochs", docs/31 checkpoints) ----

message CreateCheckpoint {
  Id task_id = 1;
  string kind = 2;                 // "" = the engine decides (baseline first, then deltas); BASELINE | DELTA
  string reason = 3;               // why (requested | before_completion | before_revert)
}

message CheckpointView {
  string checkpoint_id = 1;
  uint32 epoch = 2;
  string kind = 3;                 // BASELINE | DELTA
  string base_checkpoint_id = 4;
  string status = 5;               // STARTED | CURRENT | SUPERSEDED | REJECTED
  uint64 workspace_revision = 6;
  string manifest_ref = 7;         // object hash of the manifest once committed
  string integrity_hash = 8;
  string git_head = 9;
  uint32 files = 10;
  uint32 removed = 11;
  uint64 event_offset = 12;        // the runtime cursor
  uint64 index_generation = 13;
  string reason = 14;
  int64 created_at_ms = 15;
  int64 committed_at_ms = 16;      // 0 while started
}

message CheckpointCreated {
  CheckpointView checkpoint = 1;
  bool committed = 2;              // false when refused as stale
  string refusal = 3;              // NOT_NEWER | INTEGRITY_MISMATCH | ...
}

message ListCheckpoints {
  Id task_id = 1;
}

message CheckpointList {
  repeated CheckpointView checkpoints = 1;
  string current_checkpoint_id = 2;
  uint32 current_epoch = 3;
}

message RestoreCheckpoint {
  Id task_id = 1;
  string checkpoint_id = 2;        // "" = the current checkpoint
  // REQ-EV-0123: optimistic preconditions — the content hashes the caller
  // last saw (from a RewindPreview). A path whose current content differs
  // refuses the whole restore (HASH_MISMATCH) before anything is written.
  repeated FileHash expected = 3;
}

message FileHash {
  string path = 1;
  string content_hash = 2;         // sha256 of the content; "" = the path is absent
}

message CheckpointRestoreResult {
  bool restored = 1;
  string checkpoint_id = 2;
  uint32 epoch = 3;
  repeated string chain = 4;       // manifests walked, oldest first
  uint32 files_written = 5;
  uint32 files_reverted = 6;
  uint64 workspace_revision_after = 7;
  uint64 event_offset = 8;         // the restored runtime cursor
  string refusal = 9;              // OBJECT_MISMATCH | BROKEN_LINK | NO_BASELINE | HASH_MISMATCH | ...
  string detail = 10;
  uint32 preconditions_checked = 11;
}

// ---- Session branching: fork, rewind preview, session tree (REQ-EV-0077 / 0122 / 0123; docs/19) ----

// Fork a new task from one of a task's checkpoints. The fork gets its own
// git worktree (a branch at the checkpoint's HEAD with the checkpoint's
// dirty state materialized), its own revision lineage, and a
// BranchCarryoverCapsule naming exactly what it took from the source:
// the plan, answered questions, retrieval evidence its worktree still
// matches, and the source's latest context. Pending approvals and
// unfinished tool calls are never carried.
message ForkTask {
  Id task_id = 1;                  // the source task
  string checkpoint_id = 2;        // "" = the source's current checkpoint
  string goal_text = 3;            // "" = the source's goal
  repeated string carry = 4;       // PLAN | DECISIONS | EVIDENCE | CONTEXT; empty = all four
  string worktree_dir = 5;         // "" = <profile>/worktrees/<new task id>
}

message TaskForked {
  Id task_id = 1;                  // the new task (Queued)
  Id source_task_id = 2;
  string checkpoint_id = 3;
  uint32 epoch = 4;
  string capsule_ref = 5;          // object hash of the BranchCarryoverCapsule
  string worktree = 6;
  string branch = 7;
  uint64 branch_generation = 8;    // the session's, after SessionBranched
  repeated string carried = 9;
  uint32 decisions_carried = 10;
  uint32 evidence_carried = 11;
  uint32 approvals_dropped = 12;
  uint32 calls_dropped = 13;
  uint32 files_materialized = 14;
  uint64 offset = 15;
}

// What a restore to a checkpoint would do, without doing it: no event, no
// write, no revision change.
message PreviewRewind {
  Id task_id = 1;
  string checkpoint_id = 2;        // "" = the current checkpoint
}

message RewindEntryView {
  string path = 1;
  string action = 2;               // WRITE | DELETE | REVERT_TO_HEAD | REMOVE_UNTRACKED | UNCHANGED
  string current_hash = 3;         // "" when the path is absent now
  string target_hash = 4;          // "" when the path would be absent after
}

message RewindPreview {
  string checkpoint_id = 1;
  uint32 epoch = 2;
  uint64 event_offset = 3;         // the runtime cursor the checkpoint recorded
  repeated RewindEntryView entries = 4;
  uint32 files_written = 5;
  uint32 files_reverted = 6;
  uint64 workspace_revision = 7;   // the worktree's revision now (unchanged by the preview)
  string refusal = 8;              // "" when the chain validates
  string detail = 9;
}

// The session's run DAG: every task with its origin, fork edge, runs,
// checkpoints and restores, and the session's branch events.
message GetSessionTree {
  Id session_id = 1;
}

message RestoreView {
  string checkpoint_id = 1;
  uint32 epoch = 2;
  uint64 offset = 3;               // where on the log the restore was recorded
  uint32 files_written = 4;
  uint32 files_reverted = 5;
  uint32 preconditions_checked = 6;
}

message TaskRunView {
  Id run_id = 1;
  string state = 2;
}

message SessionTreeNode {
  Id task_id = 1;
  string goal_text = 2;
  string state = 3;
  string origin = 4;
  string workspace_root = 5;
  Id forked_from_task = 6;         // absent unless the task is a fork
  string forked_from_checkpoint = 7;
  uint32 forked_from_epoch = 8;
  uint64 forked_from_offset = 9;   // the runtime cursor the fork started from
  string capsule_ref = 10;
  uint64 branch_generation = 11;   // the generation the fork opened
  repeated TaskRunView runs = 12;
  repeated CheckpointView checkpoints = 13;
  repeated RestoreView restores = 14;
}

message BranchEventView {
  uint64 branch_generation = 1;
  string kind = 2;                 // fork | revert | cancel
  string reason = 3;
  uint64 offset = 4;
}

message SessionTreeView {
  Id session_id = 1;
  uint64 branch_generation = 2;
  repeated SessionTreeNode tasks = 3;
  repeated BranchEventView branches = 4;
}
