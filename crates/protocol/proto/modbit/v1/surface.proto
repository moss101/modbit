// Local SurfaceProtocol frames (docs/30 "Local SurfaceProtocol"). One
// SurfaceFrame per length-prefixed wire frame (crates/protocol framing).
// Commands carry the canonical CommandEnvelope; the payload of each command
// type is the matching message below encoded into `payload`.
syntax = "proto3";

package modbit.v1;

import "google/protobuf/timestamp.proto";
import "modbit/v1/domain.proto";
import "modbit/v1/envelope.proto";
import "modbit/v1/negotiation.proto";

// Authentication sent with Hello: the boot-scoped secret the client obtained
// from the Core it spawned (docs/30). Never logged, never persisted.
message Auth {
  bytes boot_secret = 1;
}

message ClientHello {
  Hello hello = 1;
  Auth auth = 2;
}

// Command payloads (M1.3 subset; docs/30 command list).
message CreateSession {
  Id space_id = 1;
}

message CreateTask {
  Id session_id = 1;
  string goal_text = 2;
  Id workspace_id = 3;
  string execution_profile = 4;
  string origin = 5;  // desktop | cli | ide_adapter | forge_issue | forge_webhook
  string workspace_root = 6;  // canonical path of the user-approved workspace (empty = general Work space)
}

message GetSessionSnapshot {
  Id session_id = 1;
}

message SubscribeEvents {
  Id session_id = 1;
  // Deliver events with offset > after_offset, then live events.
  uint64 after_offset = 2;
}

// Command acknowledgement.
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;
  COMMAND_STATUS_REPLAYED = 2;     // idempotent replay of an earlier command_id
  COMMAND_STATUS_REJECTED = 3;     // typed error in `error`
}

message CommandAck {
  Id command_id = 1;
  CommandStatus status = 2;
  string error_code = 3;
  string error_message = 4;
  // Result payload: SessionCreated / TaskCreated / SessionSnapshot encoded bytes.
  bytes result = 5;
}

message SessionCreated {
  Id session_id = 1;
  uint64 offset = 2;
}

message TaskCreated {
  Id task_id = 1;
  uint64 offset = 2;
}

message TaskView {
  Id task_id = 1;
  string goal_text = 2;
  string state = 3;
  uint64 generation = 4;
  google.protobuf.Timestamp created_at = 5;
}

message SessionSnapshot {
  Id session_id = 1;
  string state = 2;
  uint64 generation = 3;
  repeated TaskView tasks = 4;
  // Highest event offset included in this snapshot; subscribe after it.
  uint64 last_offset = 5;
}

// A stored event delivered to a subscriber.
message StoredEventFrame {
  uint64 offset = 1;
  EventEnvelope event = 2;
}

// Transport-level error (protocol violation); the connection closes after it.
message ProtocolError {
  string code = 1;
  string message = 2;
}

message SurfaceFrame {
  oneof body {
    ClientHello client_hello = 1;
    HelloAck hello_ack = 2;
    CommandEnvelope command = 3;
    CommandAck command_ack = 4;
    SubscribeEvents subscribe = 5;
    StoredEventFrame event = 6;
    ProtocolError error = 7;
  }
}

// Startup recovery report (M1.5, docs/19 "Resume algorithm", docs/33 step 11:
// CoreReady only after recovery). Served by GetRecoveryReport; the desktop
// recovery banner shows what the Core actually recovered, never invented progress.
message GetRecoveryReport {}

message RecoveryReport {
  // Monotonic per-data-directory Core start counter (fencing base).
  uint64 boot_generation = 1;
  google.protobuf.Timestamp started_at = 2;
  uint64 last_offset = 3;
  uint64 events_verified = 4;
  uint64 aggregates_verified = 5;
  bool projections_rebuilt = 6;
  uint64 sessions = 7;
  uint64 tasks = 8;
  // Empty when the store was clean; otherwise what recovery had to do.
  repeated string notes = 9;
  uint64 recovery_ms = 10;
}

// Session kernel lease (REQ-EV-0054 / REQ-EV-0273; docs/13 fencing, docs/33
// "Session kernel lease"). The single mutation owner presents the current
// generation in `CommandEnvelope.expected_generation`; a stale writer is
// rejected with STALE_LEASE. Acquiring always mints a strictly greater
// generation, so a previous owner is fenced out even across a Core restart.
message AcquireSessionLease {
  Id session_id = 1;
  string owner = 2;
}

message SessionLeaseAcquired {
  Id session_id = 1;
  uint64 lease_generation = 2;
  uint64 offset = 3;
}

// Durable, ordered user input on a task (REQ-EV-0262; MOD-INPUT-001 typed
// STEER / COLLECT / FOLLOW_UP). Requires the session lease.
message QueueInput {
  Id task_id = 1;
  string input_id = 2;   // client-stable; retries replay
  string mode = 3;       // STEER | COLLECT | FOLLOW_UP
  string text = 4;
}

message InputQueued {
  Id task_id = 1;
  uint64 sequence = 2;
  uint64 offset = 3;
}

// Bounded range read of a content-addressed object (docs/30 "OutputRef API",
// REQ-EV-0108): the whole object is never sent in one frame.
message ReadObjectRange {
  string object_hash = 1;
  uint64 offset = 2;
  uint64 length = 3;     // capped at MAX_OBJECT_CHUNK (1 MiB)
}

message ObjectRangeChunk {
  string object_hash = 1;
  uint64 total_bytes = 2;
  uint64 offset = 3;
  bytes data = 4;
  bytes checksum_sha256 = 5;  // of the whole object
}

// Direct tool invocation through the registry, policy and event loop (M2.4,
// docs/16 "Tool completion proof"). The Core records ToolCall events and
// returns the docs/30 ToolCallResult. Requires the session lease.
message InvokeTool {
  Id task_id = 1;
  string tool_name = 2;          // namespace.name from the canonical inventory (docs/17)
  string arguments_json = 3;
  Id tool_call_id = 4;           // client-stable; retries replay
  uint64 output_budget_bytes = 5;
}

message ToolInvoked {
  Id tool_call_id = 1;
  string status = 2;             // SUCCESS | APPLICATION_FAILURE | INFRA_FAILURE | CANCELLED | UNKNOWN_OUTCOME | POLICY_DENIED | INVALID_ARGUMENTS
  string structured_output_json = 3;
  string stdout_ref = 4;         // object hash when spilled
  string error_code = 5;
  string error_message = 6;
  uint64 workspace_revision_after = 7;
  string result_ref = 8;         // object hash of the full ToolCallResult JSON
}

message ListTools {}

message ToolSpecView {
  string name = 1;
  string version = 2;
  string effect_class = 3;
  string input_schema_json = 4;
  string description = 5;
}

message ToolList {
  repeated ToolSpecView tools = 1;
}
