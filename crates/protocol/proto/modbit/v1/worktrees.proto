// Worktree isolation, lifecycle and apply-back (REQ-PX-118, REQ-PX-065,
// REQ-PX-066; docs/62, docs/65 AFW-J05..J08, docs/20).
//
// A task created with `TASK_ISOLATION_WORKTREE` runs in a worktree the Core
// manages outside the user's checkout. What it produced reaches the checkout
// only through `ApplyWorktree`, a protected effect bound to the exact
// candidate (the worktree's tree) and to the checkout's state, with a
// pre-apply checkpoint so `UndoApply` is exact. The Core removes a worktree
// only when `RunWorktreeCleanup` (or its own schedule) finds it eligible.
//
// The fields these messages add to existing messages of surface.proto use
// the block 280-299: `CreateTask.isolation` and `TaskView.isolation` /
// `TaskView.origin_root`.
syntax = "proto3";

package modbit.v1;

import "modbit/v1/domain.proto";

// Where a task's effects land. UNSPECIFIED means the Core's recorded default
// (NONE unless the profile says otherwise); a client never needs to send it.
enum TaskIsolation {
  TASK_ISOLATION_UNSPECIFIED = 0;
  TASK_ISOLATION_NONE = 1;        // the task works in the workspace root it names
  TASK_ISOLATION_WORKTREE = 2;    // the task works in its own worktree; the checkout is untouched until ApplyWorktree
}

// ---- Retention policy and cleanup (REQ-PX-065) ----

// The retention policy of a cleanup run. A zero field keeps the default.
message WorktreePolicy {
  uint32 max_worktrees = 1;       // default 25
  uint64 max_bytes = 2;           // default 50 GiB
  int64 protect_ms = 3;           // a worktree younger than this is never removed; default 10 minutes
  uint32 hysteresis_percent = 4;  // removal continues down to this percent of each cap; default 80
}

// One worktree as the Core sees it, joined with the task that owns it.
message WorktreeView {
  string worktree_id = 1;
  Id task_id = 2;
  string kind = 3;                // TASK | FORK | SUBAGENT | TOOL
  string path = 4;
  string origin_root = 5;         // the user's checkout it was made from
  string branch = 6;
  string base_revision = 7;       // "" for a worktree of a repository with no commit
  string state = 8;               // ACTIVE | MISSING | REMOVED
  string disposition = 9;         // "" | APPLIED | MERGED | DISCARDED | EXPORTED
  bool dirty = 10;                // uncommitted or untracked files in it
  bool unapplied = 11;            // it holds a result no disposition covers
  uint32 changed_files = 12;
  uint64 bytes = 13;
  int64 created_at_ms = 14;
  int64 last_activity_ms = 15;
  bool task_running = 16;         // its task has not ended
  bool orphan = 17;               // no task of this Core owns it
  bool protected = 18;            // running task, or younger than the protection window
  bool removable = 19;            // the cleanup would remove it if the caps asked for it
  string removable_reason = 20;   // why it is, or is not, removable
  string setup_status = 21;       // "" | NONE | SKIPPED_UNTRUSTED | PASSED | FAILED | TIMED_OUT
  string setup_detail = 22;
  repeated string neutralized = 23;  // kinds of repository program the hardened runner refused
}

message WorktreeKept {
  string worktree_id = 1;
  string why = 2;
}

// What one cleanup run did. A run that did not happen is SKIPPED, never
// COMPLETED.
message WorktreeCleanupReport {
  string run_id = 1;
  string owner = 2;               // who held the cleanup lease
  string reason = 3;              // why it ran (scheduled | catch-up | requested | ...)
  string status = 4;              // COMPLETED | SKIPPED | DRY_RUN
  string skipped_reason = 5;      // set when SKIPPED
  uint32 scanned = 6;
  uint32 removed = 7;
  uint64 bytes_freed = 8;
  repeated string errors = 9;
  repeated string removed_ids = 10;
  repeated WorktreeKept kept = 11;
  repeated string attention = 12; // worktrees that need a person's decision
  int64 started_at_ms = 13;
  int64 finished_at_ms = 14;
  WorktreePolicy policy = 15;     // the policy this run applied
  uint32 remaining = 16;
  uint64 remaining_bytes = 17;
  string holder_owner = 18;       // for SKIPPED by a held lease: who holds it
  string holder_reason = 19;
}

message ListWorktrees {
  Id session_id = 1;              // optional: only worktrees of this session's tasks
  Id task_id = 2;                 // optional: only this task's
}

message WorktreeList {
  repeated WorktreeView worktrees = 1;
  uint32 count = 2;               // ACTIVE worktrees
  uint64 total_bytes = 3;
  WorktreePolicy policy = 4;      // the policy in force
  WorktreeCleanupReport last_cleanup = 5;  // the last run, completed or skipped; absent if none
  repeated string attention = 6;
  int64 next_cleanup_at_ms = 7;   // when the schedule next fires; 0 if not scheduled
  int64 last_completed_at_ms = 8; // the last COMPLETED run
}

// Run a cleanup now (under the single cleanup lease). A second request while
// the lease is held is refused with CLEANUP_LEASE_HELD, naming the holder.
message RunWorktreeCleanup {
  string reason = 1;
  bool dry_run = 2;               // decide and report, remove nothing
  WorktreePolicy policy = 3;      // overrides the defaults for this run
}

// ---- Apply-back (REQ-PX-066) ----

// Apply the task's worktree result to the checkout it was made from. The
// first call classifies; a clean plan (or a chosen option) asks for the
// approval of exactly that plan; calling again after ResolveApproval applies.
message ApplyWorktree {
  Id task_id = 1;
  uint64 expected_candidate_revision = 2;  // the review's revision; 0 = the current one
  // "" and CANCEL do nothing about conflicts. MERGE_MANUALLY | STASH |
  // OVERWRITE | FULL_OVERWRITE | UNDO_AND_APPLY act on them.
  string option = 3;
  // Typed confirmation: every path an overwrite replaces and every protected
  // path the apply writes, named.
  repeated string confirm_paths = 4;
  // Remember a non-destructive option for this task's later conflicts. A
  // destructive option is never remembered.
  bool remember = 5;
  // The plan digest the person reviewed; when set and different from the
  // Core's current one the apply is STALE.
  string expected_plan_digest = 6;
}

message ApplyPathView {
  string path = 1;
  string change = 2;              // ADD | MODIFY | DELETE
  string state = 3;               // CLEAN | ALREADY_APPLIED | AUTO_MERGE | CONFLICT | UNSUPPORTED
  string conflict = 4;            // BOTH_MODIFIED | ADD_ADD | DELETE_MODIFY | MODIFY_DELETE | BINARY | TYPE_CHANGE
  bool protected = 5;
  bool markers_available = 6;
}

message ApplyOptionView {
  string option = 1;
  bool destructive = 2;           // replaces bytes only Undo can bring back
  bool needs_confirmation = 3;
  repeated string confirm_paths = 4;  // what the confirmation must name
  bool available = 5;
  string why_unavailable = 6;
}

// The typed conflict result: every path, the options and their defaults.
// Cancel is always the default.
message ApplyConflictView {
  string plan_digest = 1;
  string candidate_tree = 2;
  string checkout_head = 3;
  uint64 candidate_revision = 4;
  repeated ApplyPathView paths = 5;
  repeated string conflicting_paths = 6;
  repeated string protected_paths = 7;
  repeated string dirty_paths = 8;
  repeated ApplyOptionView options = 9;
  string default_option = 10;     // CANCEL
  string remembered_option = 11;  // a remembered non-destructive choice, or ""
}

message WorktreeApplyAck {
  // APPROVAL_PENDING | APPLIED | CONFLICT | STALE | DENIED | CANCELLED |
  // NOTHING_TO_APPLY | UNDONE | UNDO_CONFLICT
  string status = 1;
  string apply_id = 2;
  string approval_id = 3;
  string intent_hash = 4;
  string plan_digest = 5;
  uint64 candidate_revision = 6;
  string candidate_tree = 7;
  string checkout_head_before = 8;
  ApplyConflictView conflict = 9;
  repeated string applied_paths = 10;
  repeated string unresolved_paths = 11;   // paths left with conflict markers
  repeated string effect_receipt_ids = 12;
  string detail = 13;
  string code = 14;
  string option = 15;
  string stash_ref = 16;
  bool replayed = 17;
  repeated string divergent_paths = 18;    // UNDO_CONFLICT: edited since the apply
}

// Restore the checkout to its pre-apply bytes. A path the user edited since
// is a reported conflict and nothing is changed.
message UndoApply {
  Id task_id = 1;
  string apply_id = 2;            // "" = the latest apply in force
}

// Record the decision to drop a worktree's result (the worktree can then be
// removed by cleanup). Not a deletion; needs the branch name typed.
message DiscardWorktree {
  Id task_id = 1;
  string reason = 2;
  string confirm = 3;             // must equal the worktree's branch name
}

message WorktreeDiscarded {
  string worktree_id = 1;
  string disposition = 2;
  uint64 offset = 3;
}
