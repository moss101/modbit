// Sandbox Gateway <-> `modbit-guest` wire protocol (M8.3; docs/21 "Sandbox
// substrate boundary", "`modbit-guest`"; docs/33 "Sandbox Gateway"; docs/30
// "Version compatibility": guest and gateway negotiate their method set
// before a sandbox is admitted). Same length-prefixed framing as the local
// SurfaceProtocol, carried on the substrate's private channel (vsock into a
// MicroVM, a Unix socket for the reference backend). The guest never decides
// policy: it enforces the policy the gateway admitted it with and refuses
// everything else. Every call after admission is authenticated with the
// ephemeral credential the gateway issued (an HMAC over the call), so a
// frame that did not come from the gateway that admitted the guest is
// refused, and every call names the task, effect and capability it acts
// under (REQ-EV-0289).
syntax = "proto3";

package modbit.v1;

// The guest speaks first: what it is and what it can do.
message GuestHello {
  uint32 protocol_major = 1;       // the guest RPC protocol it implements
  uint32 protocol_minor = 2;
  string guest_version = 3;        // the guest binary's version
  repeated string methods = 4;     // health | exec | fs.read | fs.write | net.probe | proc | pty | fs.dir (M8.5)
  string boot_id = 5;              // unique per boot
}

// The compiled sandbox policy the guest enforces (docs/21: protected paths,
// writable roots, resource bounds; the substrate enforces network and mounts).
message GuestPolicy {
  string workspace_root = 1;              // the one writable tree
  repeated string protected_paths = 2;    // never written, whatever the call
  repeated string readable_roots = 3;     // beyond the workspace, read-only
  uint64 max_output_bytes = 4;            // per exec, per stream
  uint32 max_processes = 5;
  uint64 exec_timeout_ms = 6;             // ceiling a call may ask for
  // M8.6: the guest runs a local HTTP proxy (127.0.0.1:3128) and points
  // its processes at it; every connection goes to the gateway's egress
  // broker over the private channel, which decides by the policy.
  bool egress_proxy = 7;
}

// The gateway admits the guest (or refuses it: version, methods).
message GuestAdmit {
  uint32 protocol_major = 1;       // what the gateway speaks
  uint32 protocol_minor = 2;
  bytes credential = 3;            // ephemeral; HMAC key for every later frame
  string sandbox_id = 4;
  GuestPolicy policy = 5;
}

message GuestAdmitted {
  string sandbox_id = 1;
  string boot_id = 2;
}

message GuestRefused {
  string code = 1;                 // PROTOCOL_UNSUPPORTED | METHOD_MISSING | BAD_FRAME
  string message = 2;
}

// One call from the gateway to the guest.
message GuestCall {
  string call_id = 1;              // unique; doubles as the nonce
  string task_id = 2;              // what this call acts for
  string effect_id = 3;            // the ledgered effect (empty for reads)
  string capability = 4;           // proc.exec | fs.read | fs.write | fs.dir | net.probe | health | pty
  bytes auth = 5;                  // HMAC-SHA256(credential, call_id || capability || body)
  oneof body {
    GuestHealth health = 10;
    GuestExec exec = 11;
    GuestReadFile read_file = 12;
    GuestWriteFile write_file = 13;
    GuestNetProbe net_probe = 14;
    // M8.5
    GuestProcStart proc_start = 20;
    GuestProcFollow proc_follow = 21;
    GuestProcWrite proc_write = 22;
    GuestProcCancel proc_cancel = 23;
    GuestPtyResize pty_resize = 24;
    GuestListDir list_dir = 30;
    GuestStat stat = 31;
    GuestMkdir mkdir = 32;
    GuestRemove remove = 33;
    GuestRename rename = 34;
  }
}

message GuestHealth {}

message GuestExec {
  repeated string argv = 1;
  string cwd = 2;
  repeated string env = 3;         // KEY=VALUE; nothing inherited
  uint64 timeout_ms = 4;
  bytes stdin = 5;
}

message GuestReadFile {
  string path = 1;
  uint64 max_bytes = 2;
}

message GuestWriteFile {
  string path = 1;
  bytes content = 2;
}

// Whether the guest can open a TCP connection (proves the network policy).
message GuestNetProbe {
  string host = 1;
  uint32 port = 2;
  uint64 timeout_ms = 3;
}

message GuestReply {
  string call_id = 1;
  bytes auth = 2;                  // HMAC-SHA256(credential, call_id || body)
  oneof body {
    GuestHealthReport health = 10;
    GuestExecResult exec = 11;
    GuestFileContent file = 12;
    GuestFileWritten written = 13;
    GuestNetProbeResult probe = 14;
    GuestRefusal refusal = 15;
    // M8.5
    GuestProcStarted proc_started = 20;
    GuestProcOutput proc_output = 21;
    GuestProcAck proc_ack = 22;
    GuestDirListing listing = 30;
    GuestStatResult stat = 31;
    GuestFsDone fs_done = 32;
  }
}

message GuestHealthReport {
  string boot_id = 1;
  uint64 uptime_ms = 2;
  uint32 processes = 3;
  string kernel = 4;               // uname -r, "" where unknown
}

message GuestExecResult {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
  bool timed_out = 6;
  uint64 duration_ms = 7;
}

message GuestFileContent {
  bytes content = 1;
  bool truncated = 2;
}

message GuestFileWritten {
  uint64 bytes = 1;
}

message GuestNetProbeResult {
  bool reachable = 1;
  string error = 2;                // the OS error when not
}

message GuestRefusal {
  string code = 1;                 // UNAUTHENTICATED | REPLAYED | PROTECTED_PATH | OUTSIDE_WORKSPACE | METHOD_MISSING | LIMIT_EXCEEDED | BAD_CALL
  string message = 2;
}

message GuestFrame {
  oneof body {
    GuestHello hello = 1;
    GuestAdmit admit = 2;
    GuestAdmitted admitted = 3;
    GuestRefused refused = 4;
    GuestCall call = 5;
    GuestReply reply = 6;
  }
}

// ---- M8.5: typed process, filesystem and PTY RPC ------------------------
// Processes are started and then followed: output is kept in a bounded
// ring inside the guest with a cursor, so a follower that detaches (a
// gateway link lost, a worker handed over) attaches again and replays from
// its cursor (docs/21 "PTY attach/replay"). A PTY-backed process is the
// same call with `pty` set.

message GuestProcStart {
  repeated string argv = 1;
  string cwd = 2;
  repeated string env = 3;         // KEY=VALUE; nothing inherited
  uint64 timeout_ms = 4;           // wall-clock ceiling; 0 = the policy's
  bool pty = 5;
  uint32 cols = 6;
  uint32 rows = 7;
  bool stdin_open = 8;             // keep stdin open for GuestProcWrite
}

message GuestProcStarted {
  string proc_id = 1;
  uint32 pid = 2;
}

// Follow a process: output after `after_cursor` (up to `max_bytes`), waiting
// up to `wait_ms` for more when there is none yet; the exit when it has one.
message GuestProcFollow {
  string proc_id = 1;
  uint64 after_cursor = 2;
  uint64 max_bytes = 3;
  uint64 wait_ms = 4;
}

message GuestProcOutput {
  string proc_id = 1;
  bytes data = 2;                  // stdout and stderr interleaved as produced (a PTY has one stream)
  uint64 cursor = 3;               // the cursor after `data`
  bool truncated = 4;              // bytes before `after_cursor` fell out of the ring
  bool running = 5;
  optional int32 exit_code = 6;
  bool timed_out = 7;
  bool cancelled = 8;
  uint64 total_bytes = 9;          // produced so far
}

message GuestProcWrite {
  string proc_id = 1;
  bytes data = 2;
  bool close_stdin = 3;
}

message GuestProcCancel {
  string proc_id = 1;
}

message GuestPtyResize {
  string proc_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message GuestProcAck {
  string proc_id = 1;
}

message GuestListDir {
  string path = 1;
  uint32 max_entries = 2;
}

message GuestDirEntry {
  string name = 1;
  string kind = 2;                 // file | dir | symlink | other
  uint64 size = 3;
  int64 modified_ms = 4;
}

message GuestDirListing {
  repeated GuestDirEntry entries = 1;
  bool truncated = 2;
}

message GuestStat {
  string path = 1;
}

message GuestStatResult {
  bool exists = 1;
  string kind = 2;
  uint64 size = 3;
  int64 modified_ms = 4;
  uint32 mode = 5;
}

message GuestMkdir {
  string path = 1;
}

message GuestRemove {
  string path = 1;
  bool recursive = 2;
}

message GuestRename {
  string from = 1;
  string to = 2;
}

message GuestFsDone {
  string path = 1;
}
