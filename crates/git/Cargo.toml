[package]
name = "modbit-git"
description = "Modbit git: branches, worktrees, diff and commit operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modbit-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
[package.metadata.modbit]
owner = "workspace-git"
canonical = []
capabilities = [
  { id = "git.worktree", requirements = ["REQ-EV-0125", "REQ-EV-0124"] },
  { id = "git.merge_transaction", requirements = ["REQ-EV-0067"] },
  { id = "git.snapshot", requirements = ["REQ-EV-0022"] },
]
