[package]
name = "modbit-tools"
description = "Modbit tools: typed tool registry and execution envelopes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
globset.workspace = true
hex.workspace = true
jsonschema.workspace = true
lopdf = { version = "0.44", default-features = false }
modbit-domain.workspace = true
modbit-git.workspace = true
modbit-browser.workspace = true
modbit-sandbox.workspace = true
modbit-protocol.workspace = true
modbit-terminal.workspace = true
modbit-workspace.workspace = true
png = "0.18"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
[package.metadata.modbit]
owner = "tool-runtime"
canonical = ["tool-registry"]
capabilities = [
  { id = "tools.registry", requirements = ["REQ-EV-0079", "REQ-EV-0217"] },
  { id = "tools.pipeline", requirements = ["REQ-EV-0239", "REQ-EV-0080"] },
  { id = "tools.output_ref", requirements = ["REQ-EV-0269"] },
  { id = "tools.forge", requirements = ["REQ-PX-006"] },
  { id = "tools.browser", requirements = ["REQ-EV-0276", "REQ-EV-0284"] },
]
