[package]
name = "modbit-process-hardening"
description = "Modbit process hardening: no core dumps, not attachable, no injected libraries, applied first in main"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
[package.metadata.modbit]
owner = "terminal"
canonical = []
capabilities = [{ id = "exec.process_hardening", requirements = ["REQ-PX-148"] }]
