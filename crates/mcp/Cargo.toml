workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
# owner: subsystem node id in graph/project-graph.json; canonical: doc 81 single-owner
# systems this crate is THE implementation of (the MCP hub is not one of them —
# it is an adapter behind the tool registry boundary); capabilities: production
# capabilities with their requirement ids.
[package.metadata.modbit]
owner = "external-tools"
canonical = []
capabilities = [
  { id = "external.lifecycle", requirements = ["REQ-EV-0104"] },
  { id = "external.transport_pool", requirements = ["REQ-EV-0193"] },
]
