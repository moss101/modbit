# Modbit architecture dependency rules.
# Authority: docs/12_REPOSITORY_AND_MODULE_LAYOUT.md ("Dependency direction"),
#            docs/81_ARCHITECTURE_GUARDRAILS_AND_FORBIDDEN_DUPLICATION.md ("Forbidden dependency directions"),
#            docs/35_DEPENDENCY_AND_BINDING_DECISIONS.md ("Binding rule").
# Evaluated by tools/architecture-lint over `cargo metadata`. Every [[forbid]] rule
# matches package names with globs and is violated when any package matching `to`
# is reachable from a workspace member matching `from` through normal or build
# dependencies (transitively). [[confine]] rules restrict which workspace members
# may depend directly on an external package.

[[forbid]]
from = "modbit-domain"
to = "modbit-*"
reason = "docs/12: `domain` depends on no infrastructure crate"

[[forbid]]
from = "modbit-event-store"
to = "modbit-providers"
reason = "docs/12: event-store -> provider implementation is forbidden"

[[forbid]]
from = "modbit-workspace"
to = "modbit-browser"
reason = "docs/12: workspace -> browser is forbidden"

[[forbid]]
from = "modbit-guest"
to = "modbit-cloud-api"
reason = "docs/12: guest -> cloud-api business logic is forbidden"

[[forbid]]
from = "modbit-sandbox"
to = "modbit-core-runtime"
reason = "docs/12: sandbox does not import scheduler internals"

[[forbid]]
from = "modbit-browser"
to = "modbit-core-runtime"
reason = "docs/12: browser does not import scheduler internals"

[[forbid]]
from = "modbit-providers"
to = "modbit-workspace"
reason = "docs/81: model adapters must not mutate workspace; docs/12: providers cannot call workspace tools"

[[forbid]]
from = "modbit-providers"
to = "modbit-git"
reason = "docs/81: model adapters must not mutate workspace"

[[forbid]]
from = "modbit-providers"
to = "modbit-tools"
reason = "docs/12: providers cannot call workspace tools"

[[forbid]]
from = "modbit-providers"
to = "modbit-effects"
reason = "docs/81: model adapters must not invoke protected effects directly"

[[forbid]]
from = "modbit-providers"
to = "modbit-terminal"
reason = "docs/81: model adapters must not invoke protected effects directly"

[[forbid]]
from = "modbit-protocol-state"
to = "modbit-memory"
reason = "docs/81: memory must not be used as protocol/recovery state"

[[forbid]]
from = "modbit-checkpoint"
to = "modbit-memory"
reason = "docs/81: memory must not be used as protocol/recovery state"

[[forbid]]
from = "modbit-protocol"
to = "modbit-event-store"
reason = "docs/12: UI protocol depends on domain DTOs, never database types"

[[forbid]]
from = "modbit-cli"
to = "modbit-{core-runtime,context,memory,git,checkpoint,policy,tools,workspace,terminal,sandbox,browser}"
reason = "docs/12 (DR-PX): CLI is a thin SurfaceProtocol client with no orchestration, context, memory, Git, recovery, policy or tool code"

# REQ-EV-0208 / IMP-EV-0208 (docs/40, docs/26, docs/81): the Skill Evolution Lab
# and its wiki live in modbit-skills and may not become a parallel Engineering
# Memory or recovery system. Memory access goes through modbit-memory's single
# interface; recovery truth lives only in the durability/protocol stores.
[[forbid]]
from = "modbit-skills"
to = "modbit-{protocol-state,checkpoint,compaction,event-store}"
reason = "REQ-EV-0208: evolution wiki cannot become a parallel recovery system"

[[forbid]]
from = "modbit-{skills,procedural-runtime,prompt-compiler,context,retrieval}"
to = "modbit-memory"
reason = "REQ-EV-0208: only the runtime composes Engineering Memory; producers of context/skills receive memory items through core-runtime ports, never by owning the store"

[[confine]]
package = "cubesandbox*"
allowed = ["modbit-sandbox"]
reason = "docs/35: the cloud isolation dependency is confined to the SandboxBackend adapter"

# DR-M3-001 / REQ-EV-0171: one search stack. BM25, vector and AST indexing
# live only in modbit-retrieval; everything else uses the search/context ports.
[[confine]]
package = "tantivy*"
allowed = ["modbit-retrieval"]
reason = "DR-M3-001: the BM25 index lives only in the retrieval crate"

[[confine]]
package = "usearch*"
allowed = ["modbit-retrieval"]
reason = "DR-M3-001: the vector index lives only in the retrieval crate"

[[confine]]
package = "tree-sitter*"
allowed = ["modbit-retrieval"]
reason = "DR-M3-001: AST parsing for retrieval lives only in the retrieval crate"

# ---------------------------------------------------------------------------
# Locked paths (DR-M0-002, docs/02 change control, docs/46, AGENTS.md).
# A commit that changes any of these must carry a `Decision-Record:` trailer
# naming an accepted record under docs/decisions/. Enforced by
# `architecture-lint locked` in CI.

[locked_policy]
trailer = "Decision-Record"
decisions_dir = "docs/decisions"

[[locked]]
path = "AGENTS.md"
reason = "highest-priority operating contract; changed only by governance Decision Records"

