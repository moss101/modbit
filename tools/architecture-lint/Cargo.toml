[package]
name = "architecture-lint"
description = "Modbit architecture dependency lint: rejects forbidden edges between workspace crates using `cargo metadata` (docs/12, docs/81)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
cargo_metadata.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
# owner: subsystem node id in graph/project-graph.json; canonical: doc 81 single-owner
# systems this crate is THE implementation of (at most one member per system);
# capabilities: production capabilities with their requirement ids (none yet).
[package.metadata.modbit]
owner = "governance"
canonical = []
capabilities = []
