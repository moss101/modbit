[package]
name = "modbit-cli"
description = "Modbit modbit-cli: headless thin SurfaceProtocol client (no orchestration, context, memory, Git, recovery, policy or tool code)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
modbit-protocol.workspace = true
modbit-skills.workspace = true
prost.workspace = true
rand.workspace = true
tokio.workspace = true

serde_json.workspace = true

# Windows: a spawned Core must not inherit this process's std handles (a
# caller reading our stdout would otherwise wait for the detached Core).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
# owner: subsystem node id in graph/project-graph.json; canonical: doc 81 single-owner
# systems this crate is THE implementation of (at most one member per system);
# capabilities: production capabilities with their requirement ids (none yet).
[package.metadata.modbit]
owner = "desktop"
canonical = []
capabilities = []
