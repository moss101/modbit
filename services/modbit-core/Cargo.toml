[package]
name = "modbit-core"
description = "Modbit modbit-core: local Rust daemon owning the canonical runtime, stores and the authenticated local SurfaceProtocol (docs/11 deployment units)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
modbit-domain.workspace = true
modbit-prompt-compiler.workspace = true
modbit-core-runtime.workspace = true
modbit-event-store.workspace = true
modbit-protocol-state.workspace = true
modbit-checkpoint.workspace = true
modbit-policy.workspace = true
modbit-protocol.workspace = true
modbit-providers.workspace = true
modbit-terminal.workspace = true
modbit-tools.workspace = true
modbit-procedural-runtime.workspace = true
modbit-skills.workspace = true
modbit-workspace.workspace = true
modbit-git.workspace = true
modbit-verification.workspace = true
modbit-retrieval.workspace = true
modbit-context.workspace = true
modbit-compaction.workspace = true
modbit-diagnostics.workspace = true
modbit-bench-outcome-statistics.workspace = true
modbit-observability.workspace = true
prost.workspace = true
prost-types.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
hex.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
modbit-skills.workspace = true
modbit-bench-context-economics.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Module registration parsed by `architecture-lint modules` (M0.4, docs/45, docs/81).
[package.metadata.modbit]
owner = "core-runtime"
canonical = []
capabilities = [
  { id = "surface.local_ipc", requirements = ["REQ-EV-0103", "REQ-EV-0108", "REQ-EV-0192"] },
  { id = "events.subscribe_from_offset", requirements = ["REQ-EV-0010"] },
  { id = "tools.invoke", requirements = ["REQ-EV-0079", "REQ-EV-0239", "REQ-EV-0080"] },
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
