<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search palette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modbit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="mb app" style="position:relative">
  <aside class="side">
    <div class="sbar"><button class="ibtn" aria-label="Hide sidebar"><span class="ms" aria-hidden="true">view_sidebar</span></button><span class="grow"></span><button class="ibtn" aria-label="Back"><span class="ms" aria-hidden="true">arrow_back</span></button><button class="ibtn" aria-label="Forward"><span class="ms" aria-hidden="true">arrow_forward</span></button></div>
    <nav class="snav" aria-label="Main">
      <button class="nv on"><span class="ms" aria-hidden="true">add</span>New task<span class="kbd">⌘N</span></button>
      <button class="nv"><span class="ms" aria-hidden="true">inbox</span>Inbox<span class="badge warn">2</span></button>
      <button class="nv"><span class="ms" aria-hidden="true">schedule</span>Automations</button>
      <button class="nv"><span class="ms" aria-hidden="true">rate_review</span>Review</button>
      <button class="nv"><span class="ms" aria-hidden="true">tune</span>Customize</button>
    </nav>
    <div class="shd">Tasks<span class="grow"></span><button class="ibtn on" aria-label="Search tasks"><span class="ms" aria-hidden="true">search</span></button><button class="ibtn" aria-label="Group, sort and filter"><span class="ms" aria-hidden="true">filter_list</span></button><button class="ibtn" aria-label="More"><span class="ms" aria-hidden="true">more_horiz</span></button></div>
    <div class="slist">
      <button class="grp">modbit<span class="ms" aria-hidden="true">expand_more</span></button>
      <button class="srow"><span class="t">Wire the updater signing step into the release pipeline</span><span class="ms fill c-warn s16" role="img" aria-label="Needs you">error</span></button>
      <button class="srow"><span class="t">Clean the build output</span><span class="ms fill c-warn s16" role="img" aria-label="Needs you">error</span></button>
      <button class="srow"><span class="t">Add glm-5.3-flash to the price catalog</span><span class="ms c-acc s16 spin" role="img" aria-label="Working">progress_activity</span></button>
      <button class="srow"><span class="t">Fix accounting reconciliation in the px133 rerun</span><span class="ms c-ok s16" role="img" aria-label="Ready to review">merge</span><span class="n">5</span><span class="udot"></span></button>
      <button class="grp">dossier<span class="ms" aria-hidden="true">expand_more</span></button>
      <button class="srow"><span class="t">Draft the SBOM decision record</span><span class="udot idle"></span></button>
    </div>
    <div class="sfoot"><span class="avatar">M</span><span>mohsin</span><span class="live"><i></i>Core</span><span class="grow"></span><button class="ibtn" aria-label="Help"><span class="ms" aria-hidden="true">help</span></button><button class="ibtn" aria-label="Settings"><span class="ms" aria-hidden="true">settings</span></button></div>
  </aside>

  <main class="card main">
    <div class="home">
      <div class="wrap" style="margin-top:10vh">
        <div class="hhead"><span class="brand">Modbit</span><div class="segctl"><button>Cloud</button><button class="on">This Mac</button></div></div>
        <div class="tray"><div class="composer"><div style="min-height:54px;font-size:15px" class="c-dim">Describe a task. Type @ to add files, / to run a skill.</div><div class="bar"><button class="ibtn" aria-label="Attach"><span class="ms" aria-hidden="true">add</span></button><button class="chip"><span class="ms" aria-hidden="true">all_inclusive</span>Agent</button><span class="grow"></span><button class="chip">Auto balance</button></div></div></div>
      </div>
    </div>
  </main>

  <div class="scrim" aria-hidden="true"></div>
  <div class="dlg" role="dialog" aria-label="Search" style="position:absolute;left:50%;top:112px;transform:translateX(-50%);width:640px;padding:0;gap:0;z-index:8">
    <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)">
      <span class="ms c-dim" aria-hidden="true">search</span>
      <label class="sr" for="q">Search tasks, conversations and actions</label>
      <input id="q" value="px13" style="flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink)">
      <span class="keys"><kbd>Esc</kbd></span>
    </div>
    <div style="padding:8px">
      <div class="menu flat" style="width:auto;box-shadow:none;padding:0">
        <div class="h" style="text-transform:none;letter-spacing:0">Tasks</div>
        <button class="mi row is-hover"><span class="ms c-ok" aria-hidden="true">merge</span><span style="min-width:0;flex:1">Fix accounting reconciliation in the <b>px13</b>3 rerun</span><span class="sc">modbit · ready</span></button>
        <button class="mi row"><span class="ms c-acc" aria-hidden="true">progress_activity</span><span style="min-width:0;flex:1">Re-run the <b>px13</b>5 summary</span><span class="sc">modbit · working</span></button>
        <div class="h" style="text-transform:none;letter-spacing:0">In conversations</div>
        <button class="mi row"><span class="ms" aria-hidden="true">chat_bubble</span><span style="min-width:0;flex:1">“…<b>px13</b>5 had five runs with unknown cost…”</span><span class="sc">Add glm-5.3-flash · 3m ago</span></button>
        <div class="h" style="text-transform:none;letter-spacing:0">Files</div>
        <button class="mi row"><span class="ms" aria-hidden="true">description</span><span style="min-width:0;flex:1" class="mono">benchmarks/live-results/<b>px13</b>3/summary.md</span><span class="sc">modbit</span></button>
        <div class="h" style="text-transform:none;letter-spacing:0">Actions</div>
        <button class="mi row"><span class="ms" aria-hidden="true">add</span><span style="flex:1">New task about “px13”</span><span class="sc">⌘N</span></button>
        <button class="mi row"><span class="ms" aria-hidden="true">shield</span><span style="flex:1">Change run mode</span><span class="sc">⇧⌘M</span></button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;height:40px;padding:0 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3)">
      <span class="rowwrap" style="gap:6px"><span class="keys"><kbd>↑</kbd><kbd>↓</kbd></span>move</span>
      <span class="rowwrap" style="gap:6px"><span class="keys"><kbd>↵</kbd></span>open</span>
      <span class="rowwrap" style="gap:6px"><span class="keys"><kbd>⌥</kbd><kbd>↵</kbd></span>open in split view</span>
      <span class="grow"></span><span>Searches every task’s conversation</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
