name: stdin-loop
on:
  push:
    branches: [wave6/cloud-stdin]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
jobs:
  loop:
    name: stdin loop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start Postgres 16 and SeaweedFS S3 (docs/24 — Postgres and S3-compatible object storage)
        # The public MinIO images (quay.io/minio, minio/* on Docker Hub) were
        # withdrawn from anonymous pull; SeaweedFS's S3 gateway, pinned by
        # digest, serves the same SigV4 path-style API with one identity.
        run: |
          set -euo pipefail
          docker run -d --name modbit-cloud-pg -e POSTGRES_PASSWORD=modbit -e POSTGRES_USER=modbit -e POSTGRES_DB=modbit -p 127.0.0.1:5439:5432 postgres:16-alpine
          printf '%s' '{"identities":[{"name":"modbit","credentials":[{"accessKey":"modbit","secretKey":"modbitsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name modbit-cloud-s3 -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" -p 127.0.0.1:9009:8333 chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62 server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for i in $(seq 1 60); do docker exec modbit-cloud-pg pg_isready -U modbit && break; sleep 1; done
          docker exec modbit-cloud-pg pg_isready -U modbit
          # Anonymous requests are refused (403) once the gateway is up.
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9009/ || true)" = "403" ] && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf -X PUT --user modbit:modbitsecret --aws-sigv4 "aws:amz:us-east-1:s3" http://127.0.0.1:9009/modbit-test && break; sleep 1; done
          curl -sf --user modbit:modbitsecret --aws-sigv4 "aws:amz:us-east-1:s3" "http://127.0.0.1:9009/modbit-test?list-type=2" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' --user modbit:wrong --aws-sigv4 "aws:amz:us-east-1:s3" "http://127.0.0.1:9009/modbit-test?list-type=2")" = "403"
      - name: Build the real modbit-core the cloud worker hosts (M8.2) and the guest the reference backend runs (M8.3)
        run: cargo build --locked -p modbit-core -p modbit-execd -p modbit-guest
      - name: Sandbox substrate (M8.3) — Firecracker v1.17.0, the Firecracker CI kernel 6.1.155, BusyBox 1.35.0, pinned and checksummed; KVM for the runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p substrate && cd substrate
          gh release download v1.17.0 -R firecracker-microvm/firecracker -p 'firecracker-v1.17.0-x86_64.tgz' --clobber
          echo "06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558  firecracker-v1.17.0-x86_64.tgz" | sha256sum -c -
          tar xzf firecracker-v1.17.0-x86_64.tgz
          install -m 0755 release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64 firecracker
          curl -sSfL -o vmlinux https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.15/x86_64/vmlinux-6.1.155
          echo "e20e46d0c36c55c0d1014eb20576171b3f3d922260d9f792017aeff53af3d4f2  vmlinux" | sha256sum -c -
          curl -sSfL -o busybox https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
          echo "6e123e7f3202a8c1e9b1f94d8941580a25135382b99e8d3e34fb858bba311348  busybox" | sha256sum -c -
          # The guest's browser (M8.8): Chrome for Testing's headless shell, pinned and checksummed.
          curl -sSfL -o chrome-headless-shell-linux64.zip https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.47/linux64/chrome-headless-shell-linux64.zip
          echo "7728775cf4a35464cd81c8eea2d44d6d32ccc0bd1edfa75aea7f32d146963d63  chrome-headless-shell-linux64.zip" | sha256sum -c -
          unzip -q chrome-headless-shell-linux64.zip
          ./chrome-headless-shell-linux64/chrome-headless-shell --version
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          ./firecracker --version
      - name: Guest image (M8.3) — modbit-guest as a static musl /init over a BusyBox userland
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release -p modbit-guest --target x86_64-unknown-linux-musl
          tools/guest-image/build.sh target/x86_64-unknown-linux-musl/release/modbit-guest substrate/busybox substrate/rootfs.ext4 512 substrate/chrome-headless-shell-linux64
      - name: Sign the guest images (M8.4) — a publisher key minted for this job; the gateway trusts only it
        run: |
          set -euo pipefail
          cargo build --locked -p guest-image-tool
          keys=$(target/debug/guest-image-tool keygen --out substrate/publisher.key --key-id ci-publisher)
          echo "MODBIT_GUEST_IMAGE_KEYS=$keys" >> "$GITHUB_ENV"
          version=$(cargo pkgid -p modbit-guest | sed 's/.*[#@]//')
          target/debug/guest-image-tool sign --key substrate/publisher.key --key-id ci-publisher --kind microvm-rootfs --image substrate/rootfs.ext4 --guest-version "$version" --kernel substrate/vmlinux --built-from "$GITHUB_SHA" --out substrate/rootfs.manifest.json
          target/debug/guest-image-tool sign --key substrate/publisher.key --key-id ci-publisher --kind reference-guest --image target/debug/modbit-guest --guest-version "$version" --built-from "$GITHUB_SHA" --out substrate/guest.manifest.json
          target/debug/guest-image-tool verify --manifest substrate/rootfs.manifest.json --image substrate/rootfs.ext4 --keys "$keys"
          target/debug/guest-image-tool verify --manifest substrate/guest.manifest.json --image target/debug/modbit-guest --keys "$keys"
      - name: Loop the guest unit tests and the reference-backend contract
        env:
          MODBIT_CLOUD_TEST_DATABASE_URL: postgres://modbit:modbit@127.0.0.1:5439/modbit
          MODBIT_CLOUD_TEST_S3_ENDPOINT: http://127.0.0.1:9009
          MODBIT_CLOUD_TEST_S3_BUCKET: modbit-test
          MODBIT_CLOUD_TEST_S3_ACCESS_KEY_ID: modbit
          MODBIT_CLOUD_TEST_S3_SECRET_ACCESS_KEY: modbitsecret
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core
          MODBIT_GUEST_BIN: ${{ github.workspace }}/target/debug/modbit-guest
          MODBIT_FIRECRACKER_BIN: ${{ github.workspace }}/substrate/firecracker
          MODBIT_GUEST_KERNEL: ${{ github.workspace }}/substrate/vmlinux
          MODBIT_GUEST_ROOTFS: ${{ github.workspace }}/substrate/rootfs.ext4
          MODBIT_GUEST_IMAGE_MANIFEST: ${{ github.workspace }}/substrate/rootfs.manifest.json
          MODBIT_GUEST_BIN_MANIFEST: ${{ github.workspace }}/substrate/guest.manifest.json
          MODBIT_GUEST_CHROMIUM: /usr/bin/google-chrome
          MODBIT_GUEST_FEATURES: browser
          MODBIT_CLOUD_AUTOMATION_TEST_CLOCK: "1"
        shell: bash
        run: |
          cargo test --locked -p modbit-sandbox-gateway --test gateway --no-run
          cargo test --locked -p modbit-guest --no-run
          gfail=0; cfail=0
          for i in $(seq 1 40); do
            cargo test --locked -p modbit-guest procs:: > g.log 2>&1 || { gfail=$((gfail+1)); grep -E "panicked|iteration" g.log | head -3; }
            cargo test --locked -p modbit-sandbox-gateway --test gateway qual_m8_3 -- --nocapture > c.log 2>&1 || { cfail=$((cfail+1)); grep -E "proc_stdin|failed steps" c.log | head -3; }
          done
          echo "RESULT guest-unit failures $gfail/40 ; contract failures $cfail/40"
