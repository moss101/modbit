# TEMPORARY (wave6/gaps2): repeats the three tests that intermittently end
# `Waiting wait_reason=UserInput` on Windows, on a loaded and an unloaded
# runner, and prints the events of every failure. Removed before the final push.
name: zz-flake-probe

on:
  push:
    branches: [wave6/gaps2]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  probe:
    name: probe (windows, ${{ matrix.load }})
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        load: [plain, loaded]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --locked -p modbit-core -p modbit-cli -p modbit-execd
      - name: Build the test binaries
        run: |
          cargo test --locked --no-run -p modbit-core --test px_114_trial
          cargo test --locked --no-run -p modbit-cli --test headless
      - name: Load the machine (four busy processes)
        if: matrix.load == 'loaded'
        shell: pwsh
        run: |
          1..4 | ForEach-Object { Start-Process -FilePath powershell -ArgumentList '-NoProfile','-Command','while($true){ $x = 1 }' -WindowStyle Hidden }
      - name: Repeat
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 12); do
            echo "=== round $i"
            if ! MODBIT_TRIAL_TRACE=1 cargo test --locked -p modbit-core --test px_114_trial -- --nocapture 2>&1 | tee "round-$i-trial.log" | grep -E "^test |panicked|wait_reason|PX114_PROGRAM_ENDED|last events|NO_PROGRESS" ; then :; fi
            if grep -q "FAILED" "round-$i-trial.log"; then fails=$((fails+1)); echo "---- FAILED trial round $i"; grep -v "warning: in the working copy" "round-$i-trial.log" | tail -80; fi
            cargo test --locked -p modbit-cli --test headless 2>&1 | tee "round-$i-headless.log" | grep -E "^test .*(FAILED|ok)$|panicked" || true
            if grep -q "FAILED" "round-$i-headless.log"; then fails=$((fails+1)); echo "---- FAILED headless round $i"; grep -v "warning: in the working copy" "round-$i-headless.log" | tail -120; fi
          done
          echo "failed rounds: $fails"
