name: px132-loop
on:
  push:
    branches: [wave6/px132-empty]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: cargo build --locked -p modbit-core -p modbit-execd && cargo test --locked -p modbit-core --test px_132_services --no-run
      - name: loop
        run: |
          mkdir -p logs
          # Cold starts and a loaded machine: the failing run was the first, with a slow rustc.
          (yes > /dev/null &); (yes > /dev/null &)
          for i in $(seq 1 30); do
            sync; echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null || true
            cargo test --locked -p modbit-core --test px_132_services -- --nocapture > logs/run-$i.log 2>&1 && echo "run $i ok" || echo "run $i FAILED"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: px132-logs
          path: logs
