# Modbit CI (docs/70_CI_CD_RELEASE_AND_SUPPLY_CHAIN.md, PX-030 / docs/76).
#
# Every platform job establishes CI_COMPATIBLE only. macOS is the Alpha release
# platform; Windows and Linux become RELEASE_GRADE only through PX-031 evidence
# and a Decision Record. Nothing here is release-grade proof by itself.
#
# Actions are pinned by commit SHA (supply-chain policy, docs/70).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust CI_COMPATIBLE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        # rustup on the hosted runners installs the channel and components from
        # rust-toolchain.toml; no second copy of the pin lives in this workflow.
        run: |
          rustup show
          rustup --version
          cargo --version
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace packages (the ts-webapp fixture's vitest, docs/50)
        run: pnpm install --frozen-lockfile
      - name: Install pytest (the python-service fixture's runner, PX-033)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then python -m pip install --quiet pytest==8.4.2; else python3 -m pip install --quiet --user pytest==8.4.2 || python3 -m pip install --quiet --break-system-packages pytest==8.4.2; fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Test (includes real cargo-metadata forbidden-edge test)
        run: cargo test --workspace --locked
      - name: Architecture dependency lint (docs/12, docs/81)
        run: cargo run --locked -p architecture-lint -- --manifest-path Cargo.toml --rules tools/architecture-lint/rules.toml
      - name: Module registration lint — owner, canonical single-owner systems, capability requirement ids (M0.4, docs/45, docs/81)
        shell: bash
        run: |
          args=()
          for m in packages/*/package.json apps/desktop/package.json; do args+=(--ts-manifest "$m"); done
          cargo run --locked -p architecture-lint -- modules --repo . --manifest-path Cargo.toml --graph graph/project-graph.json --rules tools/architecture-lint/rules.toml "${args[@]}"

  cloud:
    name: cloud CI_COMPATIBLE (ubuntu-latest, real Postgres and S3-compatible storage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Start Postgres 16 and MinIO (docs/24 — Postgres and S3-compatible object storage)
        run: |
          docker run -d --name modbit-cloud-pg -e POSTGRES_PASSWORD=modbit -e POSTGRES_USER=modbit -e POSTGRES_DB=modbit -p 127.0.0.1:5439:5432 postgres:16-alpine
          docker run -d --name modbit-cloud-minio -e MINIO_ROOT_USER=modbit -e MINIO_ROOT_PASSWORD=modbitsecret -p 127.0.0.1:9009:9000 quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do docker exec modbit-cloud-pg pg_isready -U modbit && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9009/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:latest -c "mc alias set local http://127.0.0.1:9009 modbit modbitsecret && mc mb -p local/modbit-test"
      - name: Build the real modbit-core the cloud worker hosts (M8.2) and the guest the reference backend runs (M8.3)
        run: cargo build --locked -p modbit-core -p modbit-execd -p modbit-guest
      - name: Sandbox substrate (M8.3) — Firecracker v1.17.0, the Firecracker CI kernel 6.1.155, BusyBox 1.35.0, pinned and checksummed; KVM for the runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p substrate && cd substrate
          gh release download v1.17.0 -R firecracker-microvm/firecracker -p 'firecracker-v1.17.0-x86_64.tgz' --clobber
          echo "06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558  firecracker-v1.17.0-x86_64.tgz" | sha256sum -c -
          tar xzf firecracker-v1.17.0-x86_64.tgz
          install -m 0755 release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64 firecracker
          curl -sSfL -o vmlinux https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.15/x86_64/vmlinux-6.1.155
          echo "e20e46d0c36c55c0d1014eb20576171b3f3d922260d9f792017aeff53af3d4f2  vmlinux" | sha256sum -c -
          curl -sSfL -o busybox https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
          echo "6e123e7f3202a8c1e9b1f94d8941580a25135382b99e8d3e34fb858bba311348  busybox" | sha256sum -c -
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          ./firecracker --version
      - name: Guest image (M8.3) — modbit-guest as a static musl /init over a BusyBox userland
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release -p modbit-guest --target x86_64-unknown-linux-musl
          tools/guest-image/build.sh target/x86_64-unknown-linux-musl/release/modbit-guest substrate/busybox substrate/rootfs.ext4 64
      - name: Sign the guest images (M8.4) — a publisher key minted for this job; the gateway trusts only it
        run: |
          set -euo pipefail
          cargo build --locked -p guest-image-tool
          keys=$(target/debug/guest-image-tool keygen --out substrate/publisher.key --key-id ci-publisher)
          echo "MODBIT_GUEST_IMAGE_KEYS=$keys" >> "$GITHUB_ENV"
          version=$(cargo pkgid -p modbit-guest | sed 's/.*[#@]//')
          target/debug/guest-image-tool sign --key substrate/publisher.key --key-id ci-publisher --kind microvm-rootfs --image substrate/rootfs.ext4 --guest-version "$version" --kernel substrate/vmlinux --built-from "$GITHUB_SHA" --out substrate/rootfs.manifest.json
          target/debug/guest-image-tool sign --key substrate/publisher.key --key-id ci-publisher --kind reference-guest --image target/debug/modbit-guest --guest-version "$version" --built-from "$GITHUB_SHA" --out substrate/guest.manifest.json
          target/debug/guest-image-tool verify --manifest substrate/rootfs.manifest.json --image substrate/rootfs.ext4 --keys "$keys"
          target/debug/guest-image-tool verify --manifest substrate/guest.manifest.json --image target/debug/modbit-guest --keys "$keys"
      - name: Cloud API, worker, sandbox backend and gateway qualification (M8.1–M8.4 — real Postgres, real MinIO, real modbit-core, real Firecracker MicroVM, signed images)
        env:
          MODBIT_CLOUD_TEST_DATABASE_URL: postgres://modbit:modbit@127.0.0.1:5439/modbit
          MODBIT_CLOUD_TEST_S3_ENDPOINT: http://127.0.0.1:9009
          MODBIT_CLOUD_TEST_S3_BUCKET: modbit-test
          MODBIT_CLOUD_TEST_S3_ACCESS_KEY_ID: modbit
          MODBIT_CLOUD_TEST_S3_SECRET_ACCESS_KEY: modbitsecret
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core
          MODBIT_GUEST_BIN: ${{ github.workspace }}/target/debug/modbit-guest
          MODBIT_FIRECRACKER_BIN: ${{ github.workspace }}/substrate/firecracker
          MODBIT_GUEST_KERNEL: ${{ github.workspace }}/substrate/vmlinux
          MODBIT_GUEST_ROOTFS: ${{ github.workspace }}/substrate/rootfs.ext4
          MODBIT_GUEST_IMAGE_MANIFEST: ${{ github.workspace }}/substrate/rootfs.manifest.json
          MODBIT_GUEST_BIN_MANIFEST: ${{ github.workspace }}/substrate/guest.manifest.json
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p modbit-cloud-api -p modbit-cloud-worker -p modbit-sandbox -p modbit-sandbox-gateway -- --nocapture 2>&1 | tee cloud-tests.log
          if grep -q "SKIPPED" cloud-tests.log; then echo "the cloud qualification skipped itself"; exit 1; fi

  node:
    name: node CI_COMPATIBLE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  desktop-e2e:
    name: desktop E2E — real Electron app against real modbit-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the real Core
        run: cargo build --locked -p modbit-core -p modbit-execd -p modbit-cli
      - name: Build desktop bundles
        run: pnpm --filter @modbit/desktop build
      - name: Warm the Electron binary (a cold download inside the test budget stalls macOS runners)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
            xvfb-run -a pnpm --filter @modbit/desktop exec electron --version || true
          else
            pnpm --filter @modbit/desktop exec electron --version || true
          fi
      - name: Thin-client conformance suite on the real Core (PX-001)
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core${{ runner.os == 'Windows' && '.exe' || '' }}
        run: pnpm --filter @modbit/ide-adapter-core conformance
      - name: VS Code adapter against the real Core — restart and resume by cursor (PX-002)
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core${{ runner.os == 'Windows' && '.exe' || '' }}
        run: pnpm --filter @modbit/vscode-adapter test
      - name: VS Code adapter in the real extension host (PX-002; Linux under xvfb)
        shell: bash
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm --filter @modbit/vscode-adapter test:host
          else
            pnpm --filter @modbit/vscode-adapter test:host
          fi
      - name: Playwright drives the Electron app (Linux under xvfb)
        shell: bash
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm --filter @modbit/desktop exec playwright test -c e2e/playwright.config.ts
          else
            pnpm --filter @modbit/desktop exec playwright test -c e2e/playwright.config.ts
          fi
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-traces-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore

  protocol-roundtrip:
    name: protocol Rust<->TS round trip and generated-code freshness (M0.3)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate TypeScript bindings from crates/protocol/proto and require no drift (docs/70)
        run: |
          pnpm --filter @modbit/surface-protocol generate
          git diff --exit-code -- packages/surface-protocol/src/gen
      - name: Rust fixtures are fresh (Rust encoding of the samples)
        run: cargo run --locked -p protocol-fixtures -- --check
      - name: "TS: decode Rust bytes, rebuild independently, encode (writes ts fixtures)"
        run: pnpm --filter @modbit/surface-protocol test
      - name: "Rust: decode TS bytes and require identical canonical encoding"
        run: cargo test --locked -p protocol-fixtures
      - name: Committed fixtures match what both sides produced
        run: git diff --exit-code -- tests/fixtures/protocol

  locked-files:
    name: locked architecture files require a Decision Record (DR-M0-002)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check every commit in range for locked-path changes without an accepted Decision Record trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo run --locked -p architecture-lint -- locked --repo . --base "$BASE" --head "${{ github.sha }}" --rules tools/architecture-lint/rules.toml

  dossier:
    name: dossier integrity
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Manifest, graph and traceability integrity (REQ→IMP→QUAL, owners, qualifying evidence; M0.4)
        run: python3 tools/check_dossier.py --manifest
      - name: Dossier self-tests
        run: python3 tools/test_dossier.py

  ci-compatible:
    name: CI_COMPATIBLE summary (not release-grade)
    needs: [rust, node, cloud, desktop-e2e, protocol-roundtrip, locked-files, dossier]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Record platform label
        run: |
          {
            echo "## Platform result: CI_COMPATIBLE only"
            echo
            echo "Core, CLI and runtime built and tested on macOS, Linux and Windows."
            echo "This label is never release-grade by itself (docs/76, PX-030); release"
            echo "promotion requires platform-specific E2E evidence (PX-031) and a Decision Record."
          } >> "$GITHUB_STEP_SUMMARY"
