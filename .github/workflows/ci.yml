# Modbit CI (docs/70_CI_CD_RELEASE_AND_SUPPLY_CHAIN.md, PX-030 / docs/76).
#
# Every platform job establishes CI_COMPATIBLE only. macOS is the Alpha release
# platform; Windows and Linux become RELEASE_GRADE only through PX-031 evidence
# and a Decision Record. Nothing here is release-grade proof by itself.
#
# Actions are pinned by commit SHA (supply-chain policy, docs/70).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust CI_COMPATIBLE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        # rustup on the hosted runners installs the channel and components from
        # rust-toolchain.toml; no second copy of the pin lives in this workflow.
        run: |
          rustup show
          rustup --version
          cargo --version
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Test (includes real cargo-metadata forbidden-edge test)
        run: cargo test --workspace --locked
      - name: Architecture dependency lint (docs/12, docs/81)
        run: cargo run --locked -p architecture-lint -- --manifest-path Cargo.toml --rules tools/architecture-lint/rules.toml
      - name: Module registration lint — owner, canonical single-owner systems, capability requirement ids (M0.4, docs/45, docs/81)
        shell: bash
        run: |
          args=()
          for m in packages/*/package.json apps/desktop/package.json; do args+=(--ts-manifest "$m"); done
          cargo run --locked -p architecture-lint -- modules --repo . --manifest-path Cargo.toml --graph graph/project-graph.json --rules tools/architecture-lint/rules.toml "${args[@]}"

  node:
    name: node CI_COMPATIBLE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  desktop-e2e:
    name: desktop E2E — real Electron app against real modbit-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the real Core
        run: cargo build --locked -p modbit-core -p modbit-execd
      - name: Build desktop bundles
        run: pnpm --filter @modbit/desktop build
      - name: Playwright drives the Electron app (Linux under xvfb)
        shell: bash
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
            xvfb-run -a pnpm --filter @modbit/desktop exec playwright test -c e2e/playwright.config.ts
          else
            pnpm --filter @modbit/desktop exec playwright test -c e2e/playwright.config.ts
          fi
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-traces-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore

  protocol-roundtrip:
    name: protocol Rust<->TS round trip and generated-code freshness (M0.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate TypeScript bindings from crates/protocol/proto and require no drift (docs/70)
        run: |
          pnpm --filter @modbit/surface-protocol generate
          git diff --exit-code -- packages/surface-protocol/src/gen
      - name: Rust fixtures are fresh (Rust encoding of the samples)
        run: cargo run --locked -p protocol-fixtures -- --check
      - name: "TS: decode Rust bytes, rebuild independently, encode (writes ts fixtures)"
        run: pnpm --filter @modbit/surface-protocol test
      - name: "Rust: decode TS bytes and require identical canonical encoding"
        run: cargo test --locked -p protocol-fixtures
      - name: Committed fixtures match what both sides produced
        run: git diff --exit-code -- tests/fixtures/protocol

  locked-files:
    name: locked architecture files require a Decision Record (DR-M0-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check every commit in range for locked-path changes without an accepted Decision Record trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo run --locked -p architecture-lint -- locked --repo . --base "$BASE" --head "${{ github.sha }}" --rules tools/architecture-lint/rules.toml

  dossier:
    name: dossier integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Manifest, graph and traceability integrity (REQ→IMP→QUAL, owners, qualifying evidence; M0.4)
        run: python3 tools/check_dossier.py --manifest
      - name: Dossier self-tests
        run: python3 tools/test_dossier.py

  ci-compatible:
    name: CI_COMPATIBLE summary (not release-grade)
    needs: [rust, node, desktop-e2e, protocol-roundtrip, locked-files, dossier]
    runs-on: ubuntu-latest
    steps:
      - name: Record platform label
        run: |
          {
            echo "## Platform result: CI_COMPATIBLE only"
            echo
            echo "Core, CLI and runtime built and tested on macOS, Linux and Windows."
            echo "This label is never release-grade by itself (docs/76, PX-030); release"
            echo "promotion requires platform-specific E2E evidence (PX-031) and a Decision Record."
          } >> "$GITHUB_STEP_SUMMARY"
