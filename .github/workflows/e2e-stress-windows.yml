# TEMPORARY (wave6/e2e-hardening2): Windows-only stress of the desktop E2E specs that fail intermittently, with and without the
# renderer hardening. Deleted before the final push.
name: e2e-stress-windows
on:
  workflow_dispatch:
  push:
    branches: [wave6/e2e-hardening2]
    paths: [.github/workflows/e2e-stress-windows.yml]
jobs:
  stress:
    name: stress ${{ matrix.job }} (hardening ${{ matrix.harden }}, raf probe ${{ matrix.raf }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: apps-panel, harden: "off", raf: "0" }
          - { job: apps-panel, harden: "off", raf: "1" }
          - { job: apps-panel, harden: "on", raf: "0" }
          - { job: browser-feedback, harden: "on", raf: "0" }
    env:
      MODBIT_E2E_HARDEN: ${{ matrix.harden }}
      MODBIT_E2E_PROBE_RAF: ${{ matrix.raf }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked -p modbit-core -p modbit-execd -p modbit-cli
      - run: pnpm --filter @modbit/desktop build
      - run: pnpm --filter @modbit/desktop exec electron --version
        continue-on-error: true
      - name: Stress
        shell: bash
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core.exe
        run: |
          cd apps/desktop
          case "${{ matrix.job }}" in
            apps-panel) pnpm exec playwright test -c e2e/playwright.config.ts e2e/apps-panel.spec.ts --repeat-each 10 --workers 1 ;;
            browser-feedback) pnpm exec playwright test -c e2e/playwright.config.ts e2e/browser-feedback.spec.ts -g "console, network, viewport" --repeat-each 30 --workers 1 ;;
            probe) pnpm exec playwright test -c e2e/playwright.config.ts e2e/zz-stress-probe.spec.ts ;;
          esac
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-traces-${{ matrix.job }}-${{ matrix.harden }}-${{ matrix.raf }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
