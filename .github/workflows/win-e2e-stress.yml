# TEMPORARY (wave6/win-e2e3): Windows-only stress of the three desktop E2E specs that fail intermittently. Deleted before the final push.
name: win-e2e-stress
on:
  workflow_dispatch:
  push:
    branches: [wave6/win-e2e3]
    paths: [.github/workflows/win-e2e-stress.yml, .github/stress-plan.json]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: m
        run: echo "matrix=$(jq -c '{include: .}' .github/stress-plan.json)" >> "$GITHUB_OUTPUT"
  stress:
    needs: plan
    name: stress ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: The "old" arm runs the code and specs as they stood on main (7fcd48ad)
        if: matrix.arm == 'old'
        shell: bash
        run: git checkout 7fcd48ad -- apps/desktop packages/ide-adapter-core/src
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked -p modbit-core -p modbit-execd -p modbit-cli
      - run: pnpm --filter @modbit/desktop build
      - run: pnpm --filter @modbit/desktop exec electron --version
        continue-on-error: true
      - name: Wait for the last seconds of the hour (the quiet-hours window of the states spec is one hour wide)
        if: matrix.hour == 'yes'
        shell: bash
        run: |
          while true; do m=$(date -u +%M); s=$(date -u +%S); if [ "$m" = 59 ] && [ "$((10#$s))" -ge 50 ]; then break; fi; sleep 1; done
          date -u
      - name: Stress
        shell: bash
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core.exe
        run: |
          cd apps/desktop
          set +e
          PREFIX="e2e/agent-workspace.spec.ts e2e/agents.spec.ts e2e/approvals.spec.ts e2e/apps-panel.spec.ts e2e/attention.spec.ts e2e/automations.spec.ts e2e/browser-feedback.spec.ts e2e/browser-hardening.spec.ts e2e/browser-observer.spec.ts e2e/browser-semantic.spec.ts e2e/browser.spec.ts"
          BROWSER="e2e/browser-feedback.spec.ts e2e/browser-hardening.spec.ts e2e/browser-observer.spec.ts e2e/browser-semantic.spec.ts e2e/browser.spec.ts"
          FILES="${{ matrix.files }}"; [ "$FILES" = PREFIX ] && FILES="$PREFIX"; [ "$FILES" = BROWSER ] && FILES="$BROWSER"
          GREP=(); [ -n "${{ matrix.grep }}" ] && GREP=(-g "${{ matrix.grep }}")
          LOAD=${{ matrix.load || 0 }}
          for i in $(seq 1 $LOAD); do node -e "for(;;){}" & done
          pnpm exec playwright test -c e2e/playwright.config.ts $FILES "${GREP[@]}" --repeat-each ${{ matrix.repeat }} --workers 1 2>&1 | tee ../../stress.log
          echo "exit ${PIPESTATUS[0]}"
          [ "$LOAD" -gt 0 ] && kill $(jobs -p) 2>/dev/null
          true
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            grep -E "^\s+(x) |passed|failed|flaky|modbit-client|Expected:|Received:|hand-over attempts|expected lease generation|host: |core: " stress.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-${{ matrix.name }}
          path: |
            apps/desktop/test-results
            stress.log
          if-no-files-found: ignore
