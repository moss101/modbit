# TEMPORARY (wave6/win-e2e3): Windows-only stress of the three desktop E2E specs that fail intermittently. Deleted before the final push.
name: win-e2e-stress
on:
  workflow_dispatch:
  push:
    branches: [wave6/win-e2e3]
    paths: [.github/workflows/win-e2e-stress.yml]
jobs:
  stress:
    name: stress ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: preempt, spec: e2e/browser.spec.ts, grep: "human activity preemption", repeat: 20, hour: "no", old: "no" }
          - { name: semantic, spec: e2e/browser-semantic.spec.ts, grep: "pages are classified", repeat: 10, hour: "no", old: "no" }
          - { name: semantic-old-spec, spec: e2e/browser-semantic.spec.ts, grep: "pages are classified", repeat: 10, hour: "no", old: "yes" }
          - { name: states, spec: e2e/states.spec.ts, grep: "screen states: provider down", repeat: 5, hour: "no", old: "no" }
          - { name: states-at-hour-old-spec, spec: e2e/states.spec.ts, grep: "screen states: provider down", repeat: 1, hour: "yes", old: "yes" }
          - { name: states-at-hour, spec: e2e/states.spec.ts, grep: "screen states: provider down", repeat: 1, hour: "yes", old: "no" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Use the spec as it stood on main (the "before" arm)
        if: matrix.old == 'yes'
        shell: bash
        run: git checkout 7fcd48ad -- apps/desktop/${{ matrix.spec }}
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --locked -p modbit-core -p modbit-execd -p modbit-cli
      - run: pnpm --filter @modbit/desktop build
      - run: pnpm --filter @modbit/desktop exec electron --version
        continue-on-error: true
      - name: Wait for the last seconds of the hour (the quiet-hours window of the states spec is one hour wide)
        if: matrix.hour == 'yes'
        shell: bash
        run: |
          while true; do m=$(date -u +%M); s=$(date -u +%S); if [ "$m" = 59 ] && [ "$((10#$s))" -ge 50 ]; then break; fi; sleep 1; done
          date -u
      - name: Stress
        shell: bash
        env:
          MODBIT_CORE_BIN: ${{ github.workspace }}/target/debug/modbit-core.exe
        run: |
          cd apps/desktop
          set +e
          pnpm exec playwright test -c e2e/playwright.config.ts ${{ matrix.spec }} -g "${{ matrix.grep }}" --repeat-each ${{ matrix.repeat }} --workers 1 2>&1 | tee ../../stress.log
          echo "exit ${PIPESTATUS[0]}"
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            grep -E "^\s+(✓|✘|x|ok) |passed|failed|modbit-client|Error occurred in handler|Expected:|Received:|preemption" stress.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-${{ matrix.name }}
          path: |
            apps/desktop/test-results
            stress.log
          if-no-files-found: ignore
