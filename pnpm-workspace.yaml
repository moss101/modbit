# Modbit monorepo — pnpm workspace (docs/12_REPOSITORY_AND_MODULE_LAYOUT.md).
# Rust apps/services under apps/ and services/ carry no package.json and are
# ignored by pnpm; only TypeScript surfaces are workspace packages.
packages:
  - "apps/desktop"
  - "packages/*"
# Dependencies allowed to run install scripts (supply-chain policy, docs/70).
# @bufbuild/buf installs its pinned CLI binary in postinstall.
allowBuilds:
  "@bufbuild/buf": true
